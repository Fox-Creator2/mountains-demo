<!doctype html>
<html lang="ru">
<head>

<title>Гоночная трасса</title>
<style>
  :root { --ac:#4fd8ff; --warn:#ffb347; --ok:#7dff9b; --bg:rgba(8,14,24,.62); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0a1220; color:#fff; font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hud { position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 6px) 10px 0; display:flex; gap:8px; align-items:flex-start; justify-content:space-between; pointer-events:none; text-shadow:0 1px 3px #000a; }
  .hud > * { pointer-events:none; }
  #spd { white-space:nowrap; } #spd b { font-size:26px; font-weight:700; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
  #spd small { font-size:12px; opacity:.8; margin-left:3px; }
  #spd i { display:inline; font-style:normal; font-size:11px; opacity:.75; margin-left:5px; }
  #mid { flex:1; min-width:0; white-space:nowrap; text-align:center; font-variant-numeric:tabular-nums; }
  #lapT { font-size:17px; font-weight:600; }
  #gateS, #best { font-size:12px; opacity:.8; }
  #btns { display:flex; gap:6px; pointer-events:auto !important; }
  #btns button { pointer-events:auto; padding:6px 9px; }
  button { font:inherit; color:#fff; background:var(--bg); border:1px solid #ffffff30; border-radius:10px; padding:7px 11px; backdrop-filter:blur(4px); touch-action:manipulation; }
  button:active { background:#ffffff30; }
  #info { position:fixed; left:10px; right:10px; top:calc(env(safe-area-inset-top) + 50px); display:flex; justify-content:space-between; font-size:11px; opacity:.9; text-shadow:0 1px 3px #000a; pointer-events:none; font-variant-numeric:tabular-nums; }
  #chip { position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top) + 70px); padding:3px 12px; border-radius:20px; font-size:12px; font-weight:600; background:var(--bg); border:1px solid #ffffff30; pointer-events:none; white-space:nowrap; }
  #chip.auto { color:var(--ok); } #chip.man { color:var(--warn); }
  #mark { position:fixed; left:0; top:0; width:40px; height:40px; margin:-20px 0 0 -20px; pointer-events:none; display:none; will-change:transform; }
  #mark svg { width:100%; height:100%; filter:drop-shadow(0 0 3px #000); }
  #mark span { position:absolute; left:50%; top:40px; transform:translateX(-50%); font-size:11px; white-space:nowrap; text-shadow:0 1px 3px #000; }
  #toast { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); padding:8px 16px; border-radius:12px; background:var(--bg); font-size:18px; font-weight:600; opacity:0; transition:opacity .25s; pointer-events:none; text-align:center; }
  #flash { position:fixed; inset:0; background:#f33; opacity:0; pointer-events:none; transition:opacity .5s; }
  #zoneL { position:fixed; left:0; bottom:0; width:24%; height:55%; }
  #zoneR { position:fixed; right:0; bottom:0; width:76%; height:55%; }
  #thr { position:fixed; left:14px; bottom:calc(env(safe-area-inset-bottom) + 18px); width:44px; height:150px; border-radius:22px; background:var(--bg); border:1px solid #ffffff30; overflow:hidden; pointer-events:none; }
  #thrFill { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(#4fd8ff,#2a6cff); opacity:.75; }
  #thr.man #thrFill { background:linear-gradient(#ffb347,#ff6a2a); }
  #thr span { position:absolute; left:0; right:0; top:6px; text-align:center; font-size:10px; opacity:.85; }
  #stick { position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; border:2px solid #ffffff55; background:#ffffff10; display:none; pointer-events:none; }
  #stick i { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:#ffffffaa; }
  #hint { position:fixed; right:10px; bottom:calc(env(safe-area-inset-bottom) + 18px); font-size:12px; opacity:.7; text-align:right; pointer-events:none; text-shadow:0 1px 3px #000; max-width:60%; }
  #panel { position:fixed; inset:0; background:#0a1220; display:none; overflow:auto; padding:calc(env(safe-area-inset-top) + 12px) 14px 30px; touch-action:pan-y; z-index:10; }

  #phead button { font-size:20px; padding:6px 16px; }

  #panel select, #panel input[type=range] { max-width:58%; font:inherit; background:#16233a; color:#fff; border:1px solid #ffffff30; border-radius:8px; padding:5px; }

  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0a1220; z-index:20; font-size:16px; }

</head>

  <label>Трасса и скорость <select id="sPreset"></select></label>

  <label>Трасса <select id="sStyle"><option value="easy">простая, плавная</option><option value="wild">крутая, с шпильками</option></select></label>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
import { PRESETS, H_SRC, CZC, C_SRC, WRAPJS, toJs, CW, paramsFor, AP_STD, PILOTS } from "./common.js";

/* ================= настройки ================= */
const $ = id => document.getElementById(id);
const KEY = "race-settings-v1";
const S = Object.assign({ mode:"canyon", alt:1, style:"easy", preset:"fast", seed:7, skill:92, fx:1, cam:0, rival:true, resume:4, inv:false, assist:true, q:1.5, pop:1, cloud:1, pilot:"c2" }, (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })());
const saveS = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

/* ================= рельеф: одна формула для JS и шейдера ================= */
const jsSrc = H_SRC.replace(/float (\w+)(?=\s*[,)])/g, "$1").replace(/float\s+(\w+)\s*\(/g, "function $1(").replace(/float\s+(\w+)\s*=/g, "let $1 =");
const hgtRaw = new Function("const abs=Math.abs,sin=Math.sin,smoothstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)},mix=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));" + jsSrc + ";return hgt;")();
const bioRaw = new Function("const abs=Math.abs,sin=Math.sin,smoothstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)},mix=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));" + jsSrc + ";return [tmpF,wetF];")();

const nzRaw = new Function("const abs=Math.abs,sin=Math.sin,smoothstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)},mix=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));" + jsSrc + ";return nz;")();

/* ================= трасса ================= */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const ground = (x, z, SC) => Math.max(0, hgtRaw(x, z, SC));

function blurCirc(a, w) { // скользящее среднее по кругу
  const n = a.length, out = new Float64Array(n); let s = 0;
  for (let k = -w; k <= w; k++) s += a[(k + n) % n];
  for (let i = 0; i < n; i++) { out[i] = s / (2 * w + 1); s += a[(i + w + 1) % n] - a[(i - w + n) % n]; }
  return out;
}
function maxCirc(a, w) { const n = a.length, out = new Float64Array(n); for (let i = 0; i < n; i++) { let m = -1e18; for (let k = -w; k <= w; k++) m = Math.max(m, a[(i + k + n) % n]); out[i] = m; } return out; }

function computeProfile(T, k) {
  const { N, ds, kap, vmax, AMAX, ACC, BRK } = T;
  const vl = new Float64Array(N), vcap = vmax * (0.8 + 0.2 * k), aE = AMAX * 0.7 * k;
  for (let i = 0; i < N; i++) vl[i] = Math.min(vcap, Math.sqrt(aE / Math.max(kap[i], 1e-9)));
  for (let it = 0; it < 3; it++) {
    for (let i = N - 1 + N; i >= N; i--) { const a = i % N, b = (i + 1) % N; vl[a] = Math.min(vl[a], Math.sqrt(vl[b] * vl[b] + 2 * BRK * 0.8 * ds)); }
    for (let i = N; i < 2 * N; i++) { const a = i % N, b = (i - 1) % N; vl[a] = Math.min(vl[a], Math.sqrt(vl[b] * vl[b] + 2 * ACC * 0.9 * ds)); }
  }
  T.vl = vl; T.k = k;
  let s = 0, mn = 1e18; for (let i = 0; i < N; i++) { s += vl[i]; mn = Math.min(mn, vl[i]); } T.vAvg = s / N; T.vMin = mn;
}

function buildTrack(preset, seed, skill, style) {
  const easy = style !== "wild";
  const pr = paramsFor(preset.vmax), { vmax, SC } = pr;
  const Lt = vmax * 100, Rb = Lt / (2 * Math.PI) / 1.1;
  let best = null;
  for (let att = 0; att < 40; att++) {
    const rnd = rng(seed * 7919 + att * 104729 + 13), damp = easy ? 0.9 * Math.pow(0.93, att) : 0.9 + 0.05 * att;
    const c0 = (60 + 0.6 * vmax) * [0.5, 1, 2.2, 5][Math.max(0, Math.min(3, S.alt | 0))];
    const M = 600, ph = Array.from({ length: 6 }, () => rnd() * 6.28);
    const fr = [2, 3, 4, 5, 7, 9], am = (easy ? [0.30, 0.20, 0.12, 0.07, 0, 0] : [0.40, 0.34, 0.28, 0.22, 0.16, 0.12]).map(a => a * damp * (0.5 + rnd()));
    const dips = Array.from({ length: easy ? 0 : 3 + Math.floor(rnd() * 3) }, () => ({ a: rnd() * 6.283, d: (0.30 + rnd() * 0.3) * Math.min(1, 0.6 + att * 0.1), w: 0.08 + rnd() * 0.08 }));
    const xz = [];
    for (let j = 0; j < M; j++) {
      const th = 2 * Math.PI * j / M; let r = 1;
      for (let q = 0; q < 6; q++) r += am[q] * Math.sin(fr[q] * th + ph[q]);
      for (const dp of dips) { let da = Math.abs(th - dp.a); da = Math.min(da, 6.283 - da); r -= dp.d * Math.exp(-(da / dp.w) * (da / dp.w)); }
      r = Math.max(easy ? 0.55 : 0.28, r);
      xz.push([Rb * r * Math.cos(th), Rb * r * Math.sin(th) * (0.8 + 0.3 * rnd() * 0 + 0.1)]);
    }
    { let len = 0; for (let j = 0; j < M; j++) { const a = xz[j], b = xz[(j + 1) % M]; len += Math.hypot(b[0] - a[0], b[1] - a[1]); } const f = Lt * 1.2 / len; for (const q of xz) { q[0] *= f; q[1] *= f; } }
    // высота: максимум рельефа в окне + запас + плавные волны
    const sp = Lt / M, win = Math.max(2, Math.round(4000 * SC / sp));
    const g = new Float64Array(M); for (let j = 0; j < M; j++) g[j] = ground(xz[j][0], xz[j][1], SC);
    let y = blurCirc(maxCirc(g, win), win);
    const wv = [rnd() * 6.28, rnd() * 6.28];
    const P0 = xz.map((q, j) => { const th = 2 * Math.PI * j / M; return [q[0], y[j] + c0 * (0.62 + (easy ? 0.1 : 0.2) * Math.sin(3 * th + wv[0]) + (easy ? 0.04 : 0.12) * Math.sin(7 * th + wv[1])), q[1]]; });
    // резамплинг по длине дуги в N точек
    const N = 2000;
    let pts = P0;
    for (let pass = 0; pass < 2; pass++) {
      const cum = [0]; for (let j = 0; j < pts.length; j++) { const a = pts[j], b = pts[(j + 1) % pts.length]; cum.push(cum[j] + Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2])); }
      const L = cum[cum.length - 1], out = []; let seg = 0;
      for (let i = 0; i < N; i++) { const t = L * i / N; while (cum[seg + 1] < t) seg++; const a = pts[seg], b = pts[(seg + 1) % pts.length], u = (t - cum[seg]) / (cum[seg + 1] - cum[seg] || 1); out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u]); }
      // сглаживание
      const sig = pass === 0 ? Math.max(2, Math.round(N / (easy ? 100 : 330))) : 2;
      const cols = [0, 1, 2].map(c => blurCirc(Float64Array.from(out, p => p[c]), sig));
      pts = out.map((_, i) => [cols[0][i], cols[1][i], cols[2][i]]);
    }
    // страховка: поднять трассу везде, где она ближе 0.3·c0 к земле (плавно)
    for (let it = 0; it < 4; it++) {
      const dfc = new Float64Array(N); for (let i = 0; i < N; i++) dfc[i] = Math.max(0, ground(pts[i][0], pts[i][2], SC) + 0.3 * c0 - pts[i][1]);
      const up = blurCirc(maxCirc(dfc, 12), 25); for (let i = 0; i < N; i++) pts[i][1] += Math.max(up[i], dfc[i] * 0.5);
    }
    const cum = [0]; for (let j = 0; j < N; j++) { const a = pts[j], b = pts[(j + 1) % N]; cum.push(cum[j] + Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2])); }
    const L = cum[N], ds = L / N;
    const Tn = new Float64Array(3 * N), P = new Float64Array(3 * N);
    for (let i = 0; i < N; i++) { P[3 * i] = pts[i][0]; P[3 * i + 1] = pts[i][1]; P[3 * i + 2] = pts[i][2]; }
    for (let i = 0; i < N; i++) { const a = (i + N - 1) % N, b = (i + 1) % N; let tx = P[3 * b] - P[3 * a], ty = P[3 * b + 1] - P[3 * a + 1], tz = P[3 * b + 2] - P[3 * a + 2]; const l = Math.hypot(tx, ty, tz); Tn[3 * i] = tx / l; Tn[3 * i + 1] = ty / l; Tn[3 * i + 2] = tz / l; }
    let kap = new Float64Array(N);
    for (let i = 0; i < N; i++) { const a = (i + N - 1) % N, b = (i + 1) % N; kap[i] = Math.hypot(Tn[3 * b] - Tn[3 * a], Tn[3 * b + 1] - Tn[3 * a + 1], Tn[3 * b + 2] - Tn[3 * a + 2]) / (2 * ds); }
    kap = blurCirc(kap, 3);
    const T = Object.assign({ N, ds, L, P, Tn, kap, preset }, pr);
    // нормаль «вправо»
    T.Rn = new Float64Array(3 * N);
    for (let i = 0; i < N; i++) { const tx = Tn[3 * i], tz = Tn[3 * i + 2]; let rx = -tz, rz = tx; const l = Math.hypot(rx, rz) || 1; T.Rn[3 * i] = rx / l; T.Rn[3 * i + 1] = 0; T.Rn[3 * i + 2] = rz / l; }
    computeProfile(T, skill);
    const ratio = T.vAvg / vmax;
    const okMin = T.vMin >= (easy ? 0.62 : 0.32) * vmax, sc2 = easy ? (okMin ? 0 : 1) + (1 - ratio) : Math.abs(ratio - 0.66) + (okMin ? 0 : 1);
    if (!best || sc2 < best.sc2) best = { T, ratio, sc2 };
    if (easy ? (ratio >= 0.9 && okMin) : (ratio >= 0.55 && ratio <= 0.8 && okMin)) { best = { T, ratio, sc2 }; break; }
  }
  const T = best.T;
  // ворота
  const gs = vmax * 2.2, G = Math.max(8, Math.round(T.L / gs));
  T.gates = []; for (let g = 0; g < G; g++) { const i = Math.round(g * T.N / G) % T.N; T.gates.push({ i, p: new THREE.Vector3(T.P[3 * i], T.P[3 * i + 1], T.P[3 * i + 2]), t: new THREE.Vector3(T.Tn[3 * i], T.Tn[3 * i + 1], T.Tn[3 * i + 2]) }); }
  T.lapRef = T.L / T.vAvg;
  return T;
}

/* точка/касательная/нормаль по дробному индексу */
const _a = new THREE.Vector3();
function trackPoint(T, fi, out, off = 0) {
  const N = T.N; fi = ((fi % N) + N) % N; const i = Math.floor(fi), j = (i + 1) % N, u = fi - i;
  out.set(T.P[3 * i] + (T.P[3 * j] - T.P[3 * i]) * u, T.P[3 * i + 1] + (T.P[3 * j + 1] - T.P[3 * i + 1]) * u, T.P[3 * i + 2] + (T.P[3 * j + 2] - T.P[3 * i + 2]) * u);
  if (off) { out.x += T.Rn[3 * i] * off; out.z += T.Rn[3 * i + 2] * off; }
  return out;
}
const vlAt = (T, fi) => { const N = T.N; fi = ((fi % N) + N) % N; const i = Math.floor(fi), u = fi - i; return T.vl[i] * (1 - u) + T.vl[(i + 1) % N] * u; };

/* ================= самолёт ================= */
const UP = new THREE.Vector3(0, 1, 0);

/* отладка и тесты */
window.__race = {
  get life() { return life; }, get terrain() { return terrain; }, frame: t => frame(t), bio: (x, z) => { const h = hgtRaw(x, z, 1); return [h, bioRaw[0](x, z, 1, h), bioRaw[1](x, z, 1)]; }, nz: (...a) => nzRaw(...a), get renderer() { return renderer; }, get T() { return T; }, get player() { return player; }, get rival() { return rival; }, ctl, S, ground: (x, z) => gnd(x, z), cy, CW, archHit, get cyMode() { return cyMode; }, popE, CHK, altPref, AP, applyPilot, HC,
  /* симуляция без рендера: автопилот, статистика */
  sim(seconds, dt = 1 / 60) {
    const st = { t: 0, maxErr: 0, sumErr: 0, n: 0, minAgl: 1e18, crashes0: crashes, misses0: misses, passed0: gatesPassed, laps0: lapCount, maxV: 0, minV: 1e18, rollMax: 0 };
    for (let t = 0; t < seconds; t += dt) { simStep(dt); st.t = t; st.maxErr = Math.max(st.maxErr, player.err); st.sumErr += player.err; st.n++; st.minAgl = Math.min(st.minAgl, player.pos.y - gnd(player.pos.x, player.pos.z)); st.maxV = Math.max(st.maxV, player.v); st.minV = Math.min(st.minV, player.v); st.rollMax = Math.max(st.rollMax, Math.abs(player.roll)); }
    return { secs: seconds, maxErr: st.maxErr, meanErr: st.sumErr / st.n, minAgl: st.minAgl, crashes: crashes - st.crashes0, misses: misses - st.misses0, passed: gatesPassed - st.passed0, laps: lapCount - st.laps0, lastLap: lastLap, Rg: T.Rg, vAvgProfile: T.vAvg, vmax: T.vmax, L: T.L, lapRef: T.lapRef, vMin: st.minV, vMax: st.maxV, rollDeg: st.rollMax * 57.3, gates: (T.gates || []).length };
  },
  start: startGame,
  /* каньон: сколько времени самолёт вне каньона, боковые перегрузки, скорость */
  cySim(seconds, dt = 1 / 60) {
    const sc = T.SC, st = { out: 0, outLat: 0, outTop: 0, trans: 0, umax: 0, ynMax: 0, ynMin: 9, gMax: 0, vSum: 0, n: 0, wasOut: false, crashes0: cy.crashes, minClr: 1e18, rollMax: 0, aboveRim: 0, nearRim: 0, rimMin: 1e18 };
    let pf = null;
    for (let t = 0; t < seconds; t += dt) {
      const k0 = cy.nextK, cr0 = cy.crashes, px = player.pos.x, py = player.pos.y, pz = player.pos.z, pv = player.v; simStep(dt); if (cy.crashes > cr0) (st.cl = st.cl || []).push({ x: Math.round(px), yn: +((py - cyFl(px)) / cyD(px)).toFixed(2), u: +(Math.abs(pz - cyZc(px)) / cyW(px)).toFixed(2), E: +popE(px).toFixed(2), v: Math.round(pv), arch: archHit(px, py, pz, 120 * T.cs), D: Math.round(cyD(px)), gnd: Math.round(py - gnd(px, pz)) }); const p = player, x = p.pos.x, sl = CW.czd(x / sc), isl = 1 / Math.sqrt(1 + sl * sl), w0 = cyW(x), D = cyD(x);
      const nxx = -sl * isl, nzz = isl, zc = cyZc(x), rx = w0 * 1.3, rim = Math.min(gnd(x + nxx * rx, zc + nzz * rx), gnd(x - nxx * rx, zc - nzz * rx)); if (p.pos.y > rim) st.aboveRim += dt; if (p.pos.y > rim - 60 * T.cs) st.nearRim += dt; st.rimMin = Math.min(st.rimMin, rim - p.pos.y);

      st.n++; st.vSum += p.v; { const q = cy.plan; st.fk = (st.fk || 0) + (q.fk || 1); st.fn = (st.fn || 0) + (q.fn || 1); st.fc = (st.fc || 0) + (q.fc || 1); st.fo = (st.fo || 0) + (q.fo || 0); st.vtS = (st.vtS || 0) + (q.vt || 0); } if (o) st.out += dt; if (lat) st.outLat += dt; if (top) st.outTop += dt; if (o !== st.wasOut) st.trans++; st.wasOut = o;
      st.umax = Math.max(st.umax, u); st.ynMax = Math.max(st.ynMax, yn); st.ynMin = Math.min(st.ynMin, yn);
      st.gMax = Math.max(st.gMax, Math.hypot(p.ar, p.au) / 9.81); st.rollMax = Math.max(st.rollMax, Math.abs(p.roll));
      st.minClr = Math.min(st.minClr, p.pos.y - gnd(x, p.pos.z));
      if (cy.crashes === cr0 && cy.nextK !== k0) { const a = archParams(k0); st.arch = (st.arch || 0) + 1; if (p.pos.y < a.fl + a.yc) st.under = (st.under || 0) + 1; }
      st.agl = (st.agl || 0) + Math.min(1, Math.max(0, (p.pos.y - gnd(x, p.pos.z)) / D));
    }
    return { arches: st.arch || 0, under: st.under || 0, agl: +((st.agl || 0) / st.n).toFixed(3), fk: +(st.fk / st.n).toFixed(2), fn: +(st.fn / st.n).toFixed(2), fc: +(st.fc / st.n).toFixed(2), fo: +(st.fo / st.n).toFixed(2), vt: Math.round(st.vtS / st.n), cl: st.cl, out: +st.out.toFixed(1), outLat: +st.outLat.toFixed(1), outTop: +st.outTop.toFixed(1), trans: st.trans, umax: +st.umax.toFixed(2), yn: [+st.ynMin.toFixed(2), +st.ynMax.toFixed(2)], g: +st.gMax.toFixed(1), vAvg: Math.round(st.vSum / st.n), crashes: cy.crashes - st.crashes0, minClr: Math.round(st.minClr), roll: +(st.rollMax * 57.3).toFixed(0), aboveRim: +st.aboveRim.toFixed(1), nearRim: +st.nearRim.toFixed(1), rimMin: Math.round(st.rimMin), km: Math.round(player.pos.x / 1000), vmax: T.vmax, AMAXg: +(T.AMAX / 9.81).toFixed(1) };
  },
};
