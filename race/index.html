<style>

<script type="module">
import * as THREE from "three";
import { PRESETS, H_SRC, CZC, C_SRC, WRAPJS, toJs, CW, paramsFor, AP_STD, PILOTS } from "./common.js";

/* ================= настройки ================= */
const $ = id => document.getElementById(id);
const KEY = "race-settings-v1";
const S = Object.assign({ mode:"canyon", alt:1, style:"easy", preset:"fast", seed:7, skill:92, fx:1, cam:0, rival:true, resume:4, inv:false, assist:true, q:1.5, pop:1, cloud:1, pilot:"c2", tur:1, boats:1, ints:1, armor:3, autoFire:1, shield:1, low:1 }, (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })());
const saveS = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

/* ================= рельеф: одна формула для JS и шейдера ================= */
const jsSrc = H_SRC.replace(/float (\w+)(?=\s*[,)])/g, "$1").replace(/float\s+(\w+)\s*\(/g, "function $1(").replace(/float\s+(\w+)\s*=/g, "let $1 =");
const hgtRaw = new Function("const abs=Math.abs,sin=Math.sin,smoothstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)},mix=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));" + jsSrc + ";return hgt;")();
const bioRaw = new Function("const abs=Math.abs,sin=Math.sin,smoothstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)},mix=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));" + jsSrc + ";return [tmpF,wetF];")();

const nzRaw = new Function("const abs=Math.abs,sin=Math.sin,smoothstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)},mix=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));" + jsSrc + ";return nz;")();

/* ================= трасса ================= */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const ground = (x, z, SC) => Math.max(0, hgtRaw(x, z, SC));

function blurCirc(a, w) { // скользящее среднее по кругу
  const n = a.length, out = new Float64Array(n); let s = 0;
  for (let k = -w; k <= w; k++) s += a[(k + n) % n];
  for (let i = 0; i < n; i++) { out[i] = s / (2 * w + 1); s += a[(i + w + 1) % n] - a[(i - w + n) % n]; }
  return out;
}
function maxCirc(a, w) { const n = a.length, out = new Float64Array(n); for (let i = 0; i < n; i++) { let m = -1e18; for (let k = -w; k <= w; k++) m = Math.max(m, a[(i + k + n) % n]); out[i] = m; } return out; }

function computeProfile(T, k) {
  const { N, ds, kap, vmax, AMAX, ACC, BRK } = T;
  const vl = new Float64Array(N), vcap = vmax * (0.8 + 0.2 * k), aE = AMAX * 0.7 * k;
  for (let i = 0; i < N; i++) vl[i] = Math.min(vcap, Math.sqrt(aE / Math.max(kap[i], 1e-9)));
  for (let it = 0; it < 3; it++) {
    for (let i = N - 1 + N; i >= N; i--) { const a = i % N, b = (i + 1) % N; vl[a] = Math.min(vl[a], Math.sqrt(vl[b] * vl[b] + 2 * BRK * 0.8 * ds)); }
    for (let i = N; i < 2 * N; i++) { const a = i % N, b = (i - 1) % N; vl[a] = Math.min(vl[a], Math.sqrt(vl[b] * vl[b] + 2 * ACC * 0.9 * ds)); }
  }
  T.vl = vl; T.k = k;
  let s = 0, mn = 1e18; for (let i = 0; i < N; i++) { s += vl[i]; mn = Math.min(mn, vl[i]); } T.vAvg = s / N; T.vMin = mn;
}

function buildTrack(preset, seed, skill, style) {
  const easy = style !== "wild";
  const pr = paramsFor(preset.vmax), { vmax, SC } = pr;
  const Lt = vmax * 100, Rb = Lt / (2 * Math.PI) / 1.1;
  let best = null;
  for (let att = 0; att < 40; att++) {
    const rnd = rng(seed * 7919 + att * 104729 + 13), damp = easy ? 0.9 * Math.pow(0.93, att) : 0.9 + 0.05 * att;
    const c0 = (60 + 0.6 * vmax) * [0.5, 1, 2.2, 5][Math.max(0, Math.min(3, S.alt | 0))];
    const M = 600, ph = Array.from({ length: 6 }, () => rnd() * 6.28);
    const fr = [2, 3, 4, 5, 7, 9], am = (easy ? [0.30, 0.20, 0.12, 0.07, 0, 0] : [0.40, 0.34, 0.28, 0.22, 0.16, 0.12]).map(a => a * damp * (0.5 + rnd()));
    const dips = Array.from({ length: easy ? 0 : 3 + Math.floor(rnd() * 3) }, () => ({ a: rnd() * 6.283, d: (0.30 + rnd() * 0.3) * Math.min(1, 0.6 + att * 0.1), w: 0.08 + rnd() * 0.08 }));
    const xz = [];
    for (let j = 0; j < M; j++) {
      const th = 2 * Math.PI * j / M; let r = 1;
      for (let q = 0; q < 6; q++) r += am[q] * Math.sin(fr[q] * th + ph[q]);
      for (const dp of dips) { let da = Math.abs(th - dp.a); da = Math.min(da, 6.283 - da); r -= dp.d * Math.exp(-(da / dp.w) * (da / dp.w)); }
      r = Math.max(easy ? 0.55 : 0.28, r);
      xz.push([Rb * r * Math.cos(th), Rb * r * Math.sin(th) * (0.8 + 0.3 * rnd() * 0 + 0.1)]);
    }
    { let len = 0; for (let j = 0; j < M; j++) { const a = xz[j], b = xz[(j + 1) % M]; len += Math.hypot(b[0] - a[0], b[1] - a[1]); } const f = Lt * 1.2 / len; for (const q of xz) { q[0] *= f; q[1] *= f; } }
    // высота: максимум рельефа в окне + запас + плавные волны
    const sp = Lt / M, win = Math.max(2, Math.round(4000 * SC / sp));
    const g = new Float64Array(M); for (let j = 0; j < M; j++) g[j] = ground(xz[j][0], xz[j][1], SC);
    let y = blurCirc(maxCirc(g, win), win);
    const wv = [rnd() * 6.28, rnd() * 6.28];
    const P0 = xz.map((q, j) => { const th = 2 * Math.PI * j / M; return [q[0], y[j] + c0 * (0.62 + (easy ? 0.1 : 0.2) * Math.sin(3 * th + wv[0]) + (easy ? 0.04 : 0.12) * Math.sin(7 * th + wv[1])), q[1]]; });
    // резамплинг по длине дуги в N точек
    const N = 2000;
    let pts = P0;
    for (let pass = 0; pass < 2; pass++) {
      const cum = [0]; for (let j = 0; j < pts.length; j++) { const a = pts[j], b = pts[(j + 1) % pts.length]; cum.push(cum[j] + Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2])); }
      const L = cum[cum.length - 1], out = []; let seg = 0;
      for (let i = 0; i < N; i++) { const t = L * i / N; while (cum[seg + 1] < t) seg++; const a = pts[seg], b = pts[(seg + 1) % pts.length], u = (t - cum[seg]) / (cum[seg + 1] - cum[seg] || 1); out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u]); }
      // сглаживание
      const sig = pass === 0 ? Math.max(2, Math.round(N / (easy ? 100 : 330))) : 2;
      const cols = [0, 1, 2].map(c => blurCirc(Float64Array.from(out, p => p[c]), sig));
      pts = out.map((_, i) => [cols[0][i], cols[1][i], cols[2][i]]);
    }
    // страховка: поднять трассу везде, где она ближе 0.3·c0 к земле (плавно)
    for (let it = 0; it < 4; it++) {
      const dfc = new Float64Array(N); for (let i = 0; i < N; i++) dfc[i] = Math.max(0, ground(pts[i][0], pts[i][2], SC) + 0.3 * c0 - pts[i][1]);
      const up = blurCirc(maxCirc(dfc, 12), 25); for (let i = 0; i < N; i++) pts[i][1] += Math.max(up[i], dfc[i] * 0.5);
    }
    const cum = [0]; for (let j = 0; j < N; j++) { const a = pts[j], b = pts[(j + 1) % N]; cum.push(cum[j] + Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2])); }
    const L = cum[N], ds = L / N;
    const Tn = new Float64Array(3 * N), P = new Float64Array(3 * N);
    for (let i = 0; i < N; i++) { P[3 * i] = pts[i][0]; P[3 * i + 1] = pts[i][1]; P[3 * i + 2] = pts[i][2]; }
    for (let i = 0; i < N; i++) { const a = (i + N - 1) % N, b = (i + 1) % N; let tx = P[3 * b] - P[3 * a], ty = P[3 * b + 1] - P[3 * a + 1], tz = P[3 * b + 2] - P[3 * a + 2]; const l = Math.hypot(tx, ty, tz); Tn[3 * i] = tx / l; Tn[3 * i + 1] = ty / l; Tn[3 * i + 2] = tz / l; }
    let kap = new Float64Array(N);
    for (let i = 0; i < N; i++) { const a = (i + N - 1) % N, b = (i + 1) % N; kap[i] = Math.hypot(Tn[3 * b] - Tn[3 * a], Tn[3 * b + 1] - Tn[3 * a + 1], Tn[3 * b + 2] - Tn[3 * a + 2]) / (2 * ds); }
    kap = blurCirc(kap, 3);
    const T = Object.assign({ N, ds, L, P, Tn, kap, preset }, pr);
    // нормаль «вправо»
    T.Rn = new Float64Array(3 * N);
    for (let i = 0; i < N; i++) { const tx = Tn[3 * i], tz = Tn[3 * i + 2]; let rx = -tz, rz = tx; const l = Math.hypot(rx, rz) || 1; T.Rn[3 * i] = rx / l; T.Rn[3 * i + 1] = 0; T.Rn[3 * i + 2] = rz / l; }

/* ================= панель ================= */
const sP = $("sPreset"); PRESETS.forEach(p => sP.add(new Option(p.name, p.id)));

fillPilots();
$("bPilotFile").onclick = () => $("fPilot").click();
function importPilots(add) {
    let list = []; try { list = JSON.parse(localStorage.getItem("race-game-pilots") || "[]"); } catch {}
    const have = new Set(list.map(h => pilotKey(h.ap))); let n = 0, first = null;
    for (const h of add) { const k = pilotKey(h.ap); if (have.has(k)) { first = first ?? list.findIndex(x => pilotKey(x.ap) === k); continue; } list.push(h); have.add(k); first = first ?? list.length - 1; n++; }
    localStorage.setItem("race-game-pilots", JSON.stringify(list)); registerFilePilots();
    S.pilot = "file" + first; saveS(); applyPilot(); fillPilots();
    toast(n ? `Загружено пилотов: ${n}. Выбран ${list[first].name}` : `Эти пилоты уже есть. Выбран ${list[first].name}`, 4000);
}
$("fPilot").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { const add = parsePilots(JSON.parse(await f.text())); if (!add.length) return toast("В файле нет пилотов", 3000); importPilots(add); }
  catch (err) { toast("Не удалось прочитать файл: " + err.message, 4000); } };
/* ссылка с пилотами (?pilots=…) — перенос с телефона на другой компьютер/браузер */
try { const q = new URLSearchParams(location.search).get("pilots");
  if (q) { const b = q.replace(/-/g, "+").replace(/_/g, "/"), txt = decodeURIComponent(escape(atob(b + "===".slice((b.length + 3) % 4))));
    const add = parsePilots(JSON.parse(txt)); if (add.length) importPilots(add);
    history.replaceState(null, "", location.pathname); } } catch (err) { toast("Ссылка с пилотами повреждена: " + err.message, 4000); }
/* champions.json на сайте: положить файл в репозиторий — и пилоты появятся у всех */
/* champions.json из личного хранилища сайта (его пишет тренер): если зал славы в localStorage стёрт — берём из файла */
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
(async () => { try { if (localStorage.getItem("race-train-hof")) return;
  const root = await navigator.storage.getDirectory(), j = JSON.parse(await (await (await root.getFileHandle("champions.json")).getFile()).text());
  const list = parsePilots(j); if (!list.length) return;
  list.forEach((h, i) => { PILOTS["hof" + i] = { name: `#${i + 1} ${h.name}` + (h.exam ? ` · экзамен ${h.exam.f.toFixed(3)}, падений ${h.exam.c}` : ""), ap: h.ap }; });
  const key = JSON.stringify(list[0].ap); if (localStorage.getItem("race-train-seen") !== key) { localStorage.setItem("race-train-seen", key); S.pilot = "hof0"; saveS(); }
  fillPilots(); if (S.pilot.startsWith("hof")) applyPilot(); } catch {} })();
for (const [file, id, mark, tail] of [["champions.json", "site", "🌐", ""], ["champions-max.json", "sitemax", "🌐⚡", " (94 000)"]])
  fetch(file, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(j => { if (!j) return;
    parsePilots(j).forEach((h, i) => { PILOTS[id + i] = { name: pilotLabel({ ...h, name: h.name + tail }, mark), ap: h.ap }; });

$("bNew").onclick = () => { S.seed = 1 + Math.floor(rnd() * 9999); saveS(); startGame(); $("panel").style.display = "none"; };

window.__race = {
  get life() { return life; }, get terrain() { return terrain; }, frame: t => frame(t), bio: (x, z) => { const h = hgtRaw(x, z, 1); return [h, bioRaw[0](x, z, 1, h), bioRaw[1](x, z, 1)]; }, nz: (...a) => nzRaw(...a), get renderer() { return renderer; }, get T() { return T; }, get player() { return player; }, get rival() { return rival; }, get scene() { return SCN; }, get camera() { return camera; }, ctl, S, ground: (x, z) => gnd(x, z), cy, CW, archHit, shelfHit, shelves, TUR, clearTurrets, EN, clearEnemies, seedRnd, RK, fireRocket, shieldOn, zoneF, get cyMode() { return cyMode; }, popE, CHK, altPref, AP, applyPilot, HC,
  /* симуляция без рендера: автопилот, статистика */

  },
  start: startGame,
  /* каньон: сколько времени самолёт вне каньона, боковые перегрузки, скорость */
  cySim(seconds, dt = 1 / 60) {
    const sc = T.SC, st = { out: 0, outLat: 0, outTop: 0, trans: 0, umax: 0, ynMax: 0, ynMin: 9, gMax: 0, vSum: 0, n: 0, wasOut: false, crashes0: cy.crashes, minClr: 1e18, rollMax: 0, aboveRim: 0, nearRim: 0, rimMin: 1e18 };

      const k0 = cy.nextK, cr0 = cy.crashes, px = player.pos.x, py = player.pos.y, pz = player.pos.z, pv = player.v; simStep(dt); if (cy.crashes > cr0) (st.cl = st.cl || []).push({ x: Math.round(px), yn: +((py - cyFl(px)) / cyD(px)).toFixed(2), u: +(Math.abs(pz - cyZc(px)) / cyW(px)).toFixed(2), E: +popE(px).toFixed(2), v: Math.round(pv), arch: archHit(px, py, pz, 120 * T.cs), D: Math.round(cyD(px)), gnd: Math.round(py - gnd(px, pz)) }); const p = player, x = p.pos.x, sl = CW.czd(x / sc), isl = 1 / Math.sqrt(1 + sl * sl), w0 = cyW(x), D = cyD(x);
      const nxx = -sl * isl, nzz = isl, zc = cyZc(x), rx = w0 * 1.3, rim = Math.min(gnd(x + nxx * rx, zc + nzz * rx), gnd(x - nxx * rx, zc - nzz * rx)); if (p.pos.y > rim) st.aboveRim += dt; if (p.pos.y > rim - 60 * T.cs) st.nearRim += dt; st.rimMin = Math.min(st.rimMin, rim - p.pos.y);
