<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Горы мира</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@openglobus/og@0.28.7/lib/og.css">
<style>
  /* Полноэкранный глобус, снизу панель с горами */
  :root {
    --panel: rgba(16, 20, 26, 0.86);
    --chip: #262d36;
    --chip-on: #d9a441;
    --fg: #eef1f4;
    --muted: #9aa5b1;
    --err: #ff7a6b;
  }
  html, body { margin: 0; height: 100%; background: #0b0e12; color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #globus { position: absolute; top: 0; left: 0; right: 0; bottom: calc(128px + env(safe-area-inset-bottom, 0px)); }

  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; gap: 8px;
  }
  #info { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
  #info b { font-size: 16px; }
  #info span { color: var(--muted); font-variant-numeric: tabular-nums; }

  #chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 0; border-radius: 999px; padding: 9px 14px;
    background: var(--chip); color: var(--fg); font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--chip-on); color: #1a1407; font-weight: 600; }

  #ctrls { display: flex; gap: 6px; }
  #ctrls button { flex: 1; border: 0; border-radius: 10px; padding: 9px 6px;
    background: var(--chip); color: var(--fg); font-size: 13px; cursor: pointer; }
  #ctrls button.on { background: #3b6e4f; }

  #diag { position: absolute; left: 8px; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 25;
    background: var(--panel); border-radius: 10px; padding: 10px 12px; font-size: 13px;
    display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
  #diag[hidden] { display: none; }
  #cam { position: absolute; left: 12px; right: 12px; bottom: calc(136px + env(safe-area-inset-bottom, 0px)); z-index: 25;
    background: var(--panel); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  #cam[hidden] { display: none; }
  #cam .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  #cam .row b { color: var(--fg); font-variant-numeric: tabular-nums; }
  #tilt, #zoom { width: 100%; accent-color: var(--chip-on); height: 28px; }
  #diag label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  #diag .fps { color: var(--muted); font-variant-numeric: tabular-nums; }
  #log { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 8px; right: 8px; z-index: 30;
    font: 12px/1.4 ui-monospace, monospace; color: var(--err); background: rgba(0,0,0,0.75);
    border-radius: 8px; padding: 6px 8px; white-space: pre-wrap; }
  #log:empty { display: none; }

</style>
</head>
<body>
<div id="globus"></div>
<div id="log"></div>

<div id="diag" hidden>
  <b>Диагностика мерцания</b>
  <label><input type="checkbox" id="dFrames" checked> Грубая подложка + рамки гор</label>
  <label><input type="checkbox" id="dTerrain" checked> Рельеф</label>
  <label><input type="checkbox" id="dAtmos"> Атмосфера</label>
  <span class="fps" id="fps">FPS: —</span>
</div>

<div id="cam" hidden>
  <div class="row"><span>Наклон к горизонту (от вершины)</span><b id="tiltVal">—</b></div>
  <input type="range" id="tilt" min="0" max="1000" step="1" value="400">
  <div class="row"><span>0° — сбоку</span><span>85° — сверху</span></div>
  <div class="row" style="margin-top:4px"><span>Расстояние до вершины</span><b id="zoomVal">—</b></div>
  <input type="range" id="zoom" min="0" max="1000" step="1" value="500">
  <div class="row"><span>ближе</span><span>дальше</span></div>
</div>

<div id="bar">
  <div id="info"><b id="mName">Загрузка…</b><span id="mMeta"></span></div>
  <div id="chips"></div>
  <div id="ctrls">
    <button id="bMode">Телепорт</button>
    <button id="bOrbit">Облёт ⟳</button>
    <button id="bCam">Камера</button>
    <button id="bDiag" style="flex:0 0 44px">⚙</button>
  </div>
</div>

<script>
  // Любая ошибка видна прямо на экране — удобно на телефоне без консоли
  const logEl = document.getElementById("log");
  const log = (m) => { logEl.textContent += m + "\n"; };
  window.addEventListener("error", e => log("Ошибка: " + e.message));
  window.addEventListener("unhandledrejection", e => log("Ошибка: " + (e.reason && e.reason.message || e.reason)));
</script>

<script type="module">
import { Globe, XYZ, Vector, Entity, GlobusRgbTerrain, EmptyTerrain, LonLat } from
  "https://cdn.jsdelivr.net/npm/@openglobus/og@0.28.7/lib/og.es.js";

const OG_RES = "https://cdn.jsdelivr.net/npm/@openglobus/og@0.28.7/lib/res";
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";

// Вершины: долгота, широта, высота (м). r — полуразмер рамки в градусах.
// route — классический маршрут восхождения по ключевым точкам [долгота, широта, высота, название].
// Точки нанесены по известным хижинам и лагерям, точность — порядка сотен метров (это схема, не GPS-трек).
const MOUNTAINS = [
  { name: "Эльбрус", lon: 42.4392, lat: 43.3499, h: 5642, r: 0.12, routeName: "Южный (классика)", route: [
    [42.4740, 43.2645, 2350, "Азау"], [42.4600, 43.2890, 3500, "Мир"], [42.4660, 43.3015, 3800, "Гара-Баши"],
    [42.4640, 43.3130, 4100, "Приют 11"], [42.4605, 43.3290, 4700, "Скалы Пастухова"],
    [42.4560, 43.3400, 5100, "Косая полка"], [42.4470, 43.3488, 5416, "Седловина"], [42.4392, 43.3499, 5642, "Западная вершина"] ] },
  { name: "Казбек", lon: 44.5180, lat: 42.6997, h: 5054, r: 0.13, routeName: "Через Гергети", route: [
    [44.6205, 42.6625, 2170, "Церковь Гергети"], [44.6000, 42.6745, 2950, "Перевал Арша"],
    [44.5735, 42.6845, 3650, "Метеостанция"], [44.5470, 42.6915, 4400, "Плато"],
    [44.5265, 42.6975, 4900, "Седловина"], [44.5180, 42.6997, 5054, "Вершина"] ] },
  { name: "Эверест", lon: 86.9250, lat: 27.9881, h: 8849, r: 0.15, routeName: "Через Южное седло", route: [
    [86.8530, 28.0025, 5364, "Базовый лагерь"], [86.8700, 27.9965, 5600, "Ледопад Кхумбу"],
    [86.8880, 27.9900, 6065, "Лагерь I"], [86.9010, 27.9840, 6400, "Лагерь II"], [86.9170, 27.9785, 7160, "Лагерь III"],
    [86.9300, 27.9735, 7906, "Южное седло"], [86.9290, 27.9800, 8400, "Балкон"],
    [86.9262, 27.9852, 8749, "Южная вершина"], [86.9250, 27.9881, 8849, "Вершина"] ] },
  { name: "Фудзи", lon: 138.7274, lat: 35.3606, h: 3776, r: 0.12, routeName: "Тропа Ёсида", route: [
    [138.7330, 35.3955, 2305, "5-я станция"], [138.7375, 35.3880, 2390, "6-я станция"],
    [138.7365, 35.3790, 2700, "7-я станция"], [138.7340, 35.3710, 3100, "8-я станция"],
    [138.7320, 35.3650, 3710, "Край кратера"], [138.7274, 35.3606, 3776, "Кэнгаминэ"] ] },
  { name: "Килиманджаро", lon: 37.3556, lat: -3.0674, h: 5895, r: 0.20, routeName: "Марангу", route: [
    [37.5215, -3.2325, 1860, "Ворота Марангу"], [37.5170, -3.1960, 2720, "Хижина Мандара"],
    [37.4660, -3.1050, 3720, "Хижина Хоромбо"], [37.3920, -3.0835, 4720, "Хижина Кибо"],
    [37.3684, -3.0753, 5685, "Гиллманс-Пойнт"], [37.3610, -3.0710, 5756, "Стелла-Пойнт"],
    [37.3556, -3.0674, 5895, "Ухуру"] ] },
  { name: "Маттерхорн", lon: 7.6586, lat: 45.9763, h: 4478, r: 0.08, routeName: "Гребень Хёрнли", route: [
    [7.7080, 45.9908, 2583, "Шварцзее"], [7.6806, 45.9822, 3260, "Хижина Хёрнли"],
    [7.6672, 45.9795, 4003, "Хижина Сольве"], [7.6620, 45.9776, 4250, "Плечо"], [7.6586, 45.9763, 4478, "Вершина"] ] },
  { name: "Монблан", lon: 6.8652, lat: 45.8326, h: 4806, r: 0.10, routeName: "Маршрут Гуте", route: [
    [6.8130, 45.8810, 2372, "Ни-д’Эгль"], [6.8185, 45.8600, 3167, "Тет-Русс"], [6.8325, 45.8505, 3835, "Хижина Гуте"],
    [6.8410, 45.8433, 4304, "Дом-дю-Гуте"], [6.8485, 45.8390, 4362, "Валло"], [6.8580, 45.8350, 4550, "Боссы"],
    [6.8652, 45.8326, 4806, "Вершина"] ] },
  { name: "Денали", lon: -151.0074, lat: 63.0695, h: 6190, r: 0.20, routeName: "Вест-Баттресс", route: [
    [-151.1760, 62.9690, 2200, "Базовый лагерь"], [-151.1350, 62.9950, 2400, "Лагерь 7800"],
    [-151.1150, 63.0240, 3350, "Лагерь 11 000"], [-151.0900, 63.0450, 4330, "Лагерь 14 000"],
    [-151.0560, 63.0575, 5240, "Хай-кэмп 17 000"], [-151.0310, 63.0630, 5550, "Перевал Денали"],
    [-151.0074, 63.0695, 6190, "Вершина"] ] },
  { name: "Аконкагуа", lon: -70.0109, lat: -32.6532, h: 6961, r: 0.15, routeName: "Нормальный", route: [
    [-70.0640, -32.6510, 4300, "Пласа-де-Мулас"], [-70.0400, -32.6420, 5050, "Канада"],
    [-70.0270, -32.6340, 5560, "Нидо-де-Кондорес"], [-70.0170, -32.6420, 5940, "Колера"],
    [-70.0140, -32.6460, 6380, "Индепенденсия"], [-70.0120, -32.6510, 6700, "Каналета"],
    [-70.0109, -32.6532, 6961, "Вершина"] ] },
  { name: "Арарат", lon: 44.2983, lat: 39.7017, h: 5137, r: 0.10, routeName: "Южный", route: [
    [44.2950, 39.6440, 2200, "Эли"], [44.2960, 39.6700, 3200, "Лагерь 1"],
    [44.2985, 39.6875, 4200, "Лагерь 2"], [44.2983, 39.7017, 5137, "Вершина"] ] },
];

// 1) Глобальная подложка — только грубые тайлы (максимум 5-й зум), это «вид с орбиты».
const base = new XYZ("Esri низкое", {
  isBaseLayer: true, url: ESRI, maxNativeZoom: 5, visibility: true, attribution: "Esri World Imagery"
});

// 2) Для каждой горы — свой слой с extent. За пределами рамки он ничего не грузит.
const mountainLayers = MOUNTAINS.map(m => new XYZ("Гора " + m.name, {
  isBaseLayer: false, url: ESRI, maxNativeZoom: 17, visibility: true, hideInLayerSwitcher: true,
  extent: [[m.lon - m.r, m.lat - m.r], [m.lon + m.r, m.lat + m.r]]
}));

// Обычная подложка без ограничений — для сравнения в диагностике
const fullBase = new XYZ("Esri полная", {
  isBaseLayer: true, url: ESRI, maxNativeZoom: 17, visibility: false, attribution: "Esri World Imagery"
});
const terrain = new GlobusRgbTerrain();

const first = MOUNTAINS[0];
const globus = new Globe({
  target: "globus",
  name: "Earth",
  terrain: terrain,
  layers: [base, fullBase, ...mountainLayers],
  resourcesSrc: OG_RES,
  fontsSrc: OG_RES + "/fonts",
  atmosphereEnabled: false,          // атмосфера давала мерцание при облёте на телефоне
  transitionOpacityEnabled: false,   // без плавной подмены тайлов — она даёт мигание при движении камеры
  viewExtent: [first.lon - first.r, first.lat - first.r, first.lon + first.r, first.lat + first.r]
});
const planet = globus.planet;
window.planet = planet;   // для отладки из консоли браузера

// ---------------- Маршруты восхождения ----------------
const ROUTE_LIFT = 12;     // на сколько метров поднять линию над рельефом, чтобы она не тонула в склоне
const LABEL_LIFT = 70;     // подписи точек — чуть выше

// Сгущаем маршрут: точка каждые ~50 м, высота сначала линейная между ключевыми точками
function densify(route) {
  const out = [];
  for (let i = 0; i < route.length - 1; i++) {
    const [lo1, la1, h1] = route[i], [lo2, la2, h2] = route[i + 1];
    const dx = (lo2 - lo1) * 111320 * Math.cos(la1 * Math.PI / 180), dy = (la2 - la1) * 111320;
    const n = Math.max(1, Math.round(Math.hypot(dx, dy) / 50));
    for (let k = 0; k < n; k++) {
      const t = k / n;
      out.push([lo1 + (lo2 - lo1) * t, la1 + (la2 - la1) * t, h1 + (h2 - h1) * t, k === 0 ? i : -1]);
    }
  }
  const last = route[route.length - 1];
  out.push([last[0], last[1], last[2], route.length - 1]);
  return out;   // [lon, lat, h, индекс ключевой точки или -1]
}

// Кружок для отметки точки маршрута
function dot(color) {
  const c = document.createElement("canvas"); c.width = c.height = 32;
  const g = c.getContext("2d");
  g.beginPath(); g.arc(16, 16, 12, 0, Math.PI * 2);
  g.fillStyle = color; g.fill(); g.lineWidth = 4; g.strokeStyle = "#ffffff"; g.stroke();
  return c.toDataURL();
}
const DOT_WAY = dot("#ff5a2e"), DOT_TOP = dot("#ffc533");

const routeLayer = new Vector("Маршруты", {
  pickingEnabled: false, hideInLayerSwitcher: true, polygonOffsetUnits: -4
});
planet.addLayer(routeLayer);

MOUNTAINS.forEach(m => {
  m.dense = densify(m.route);
  m.line = new Entity({
    polyline: {
      pathLonLat: [m.dense.map(p => [p[0], p[1], p[2] + ROUTE_LIFT])],
      thickness: 4, color: "#ff5a2e"
    }
  });
  m.points = m.route.map((p, i) => {
    const top = i === m.route.length - 1;
    return new Entity({
      lonlat: [p[0], p[1], p[2] + LABEL_LIFT],
      billboard: { src: top ? DOT_TOP : DOT_WAY, size: [14, 14] },
      label: {
        text: p[3] + ", " + p[2] + " м",
        size: top ? 15 : 13, color: "#ffffff", outline: 0.28, outlineColor: "rgba(0,0,0,0.85)",
        offset: [10, -4]
      }
    });
  });
  routeLayer.add(m.line);
  m.points.forEach(e => routeLayer.add(e));
});

// Уточняем высоты по настоящему рельефу — только для выбранной горы и только один раз
async function drapeRoute(m) {
  if (m.draped || m.draping) return;
  m.draping = true;
  try {
    const hs = [];
    for (let i = 0; i < m.dense.length; i += 30) {
      const batch = m.dense.slice(i, i + 30).map(p => planet.getHeightAboveELL(new LonLat(p[0], p[1])));
      hs.push(...await Promise.all(batch));
    }
    // если рельеф вернул пустоту (0 или мусор) — оставляем расчётную высоту
    const fixed = m.dense.map((p, i) => {
      const h = hs[i];
      return (isFinite(h) && h > p[2] * 0.5) ? h : p[2];
    });
    m.line.polyline.setPathLonLat([m.dense.map((p, i) => [p[0], p[1], fixed[i] + ROUTE_LIFT])]);
    m.dense.forEach((p, i) => {
      if (p[3] >= 0) m.points[p[3]].setLonLat(new LonLat(p[0], p[1], fixed[i] + LABEL_LIFT));
    });
    m.draped = true;
  } catch (e) {
    log("Маршрут " + m.name + ": не удалось уточнить высоты (" + e.message + ")");
  } finally {
    m.draping = false;
  }
}

// Камера стоит позади начала маршрута и чуть сбоку и смотрит на вершину:
// на вертикальном экране путь идёт снизу вверх к вершине в центре кадра.
// Облёт, наклон и приближение работают относительно вершины, поэтому она сразу в центре.
function cameraFor(m) {
  const r = m.route, s0 = r[0], top = r[r.length - 1];
  const kx = 111320 * Math.cos(m.lat * Math.PI / 180), ky = 111320;
  const dx = (top[0] - s0[0]) * kx, dy = (top[1] - s0[1]) * ky;
  const len = Math.max(Math.hypot(dx, dy), 1500);
  const ux = dx / len, uy = dy / len;                 // направление «старт → вершина»
  const cLon = (s0[0] + top[0]) / 2, cLat = (s0[1] + top[1]) / 2, cH = (s0[2] + top[2]) / 2;
  const back = len * 0.5 + Math.max(4000, len * 0.55);   // насколько отойти назад от середины
  const side = len * 0.25;                               // небольшой сдвиг вбок для объёма
  const ex = -ux * back + uy * side, ey = -uy * back - ux * side;
  return {
    eye: new LonLat(cLon + ex / kx, cLat + ey / ky, top[2] + Math.max(3000, len * 0.55)),
    look: new LonLat(top[0], top[1], top[2]),
    center: new LonLat(cLon, cLat, cH)
  };
}

// «Верх» для камеры — местная вертикаль (нормаль к поверхности в точке камеры).
// Без этого движок в полёте берёт за верх ось Земли, и камера заваливается на бок,
// если смотрит на восток или запад.
function localUp(lonlat) {
  return planet.ellipsoid.lonLatToCartesian(new LonLat(lonlat.lon, lonlat.lat, 0)).normal();
}

let current = null, flyMode = false, orbiting = false, orbitCenter = null, orbitUp = null;

function goTo(i) {
  const m = MOUNTAINS[i];
  current = m;
  stopOrbit();
  const { eye, look } = cameraFor(m);
  planet.stopFlying();
  if (flyMode) {
    planet.flyLonLat(eye, { look, up: localUp(eye), duration: 2500 });
  } else {
    planet.viewLonLat(eye, look);                  // мгновенно, без анимации
  }
  // облёт — вокруг конечной точки подъёма (вершины маршрута)
  const top = m.route[m.route.length - 1];
  orbitCenter = planet.ellipsoid.lonLatToCartesian(new LonLat(top[0], top[1], top[2]));
  orbitUp = orbitCenter.normal();
  document.getElementById("mName").textContent = m.name;
  document.getElementById("mMeta").textContent =
    m.h.toLocaleString("ru-RU") + " м · маршрут: " + m.routeName;
  setTimeout(() => drapeRoute(m), 400);
  document.querySelectorAll(".chip").forEach((c, k) => c.classList.toggle("on", k === i));
}

// Облёт: камера вращается вокруг вертикальной оси через вершину.
// Шаг делается внутри цикла отрисовки движка (событие postdraw), а не в отдельном таймере,
// и после поворота обязательно вызывается camera.update(): rotateAround сам матрицы
// камеры не пересчитывает, из-за чего кадры рисовались то по старой, то по новой позиции — это и было мерцание.
const ORBIT_SPEED = 0.15;   // рад/с, полный круг ≈ 42 с
const ORBIT_RAMP = 1.5;     // с — плавный разгон, чтобы облёт не начинался рывком
let lastT = 0, orbitT = 0;
planet.renderer.events.on("postdraw", () => {
  if (!orbiting) return;
  const now = performance.now();
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0;
  lastT = now;
  if (dt === 0) return;
  orbitT += dt;
  const k = Math.min(1, orbitT / ORBIT_RAMP), ease = k * k * (3 - 2 * k);
  planet.camera.rotateAround(ORBIT_SPEED * ease * dt, false, orbitCenter, orbitUp);
  planet.camera.update();
});
function orbitStep() { lastT = 0; orbitT = 0; }
function stopOrbit() {
  orbiting = false;
  document.getElementById("bOrbit").classList.remove("on");
  document.getElementById("bOrbit").textContent = "Облёт ⟳";
}

const chips = document.getElementById("chips");
MOUNTAINS.forEach((m, i) => {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = m.name;
  b.onclick = () => goTo(i);
  chips.appendChild(b);
});

document.getElementById("bMode").onclick = function () {
  flyMode = !flyMode;
  this.textContent = flyMode ? "Пролёт" : "Телепорт";
};
// Облёт начинается прямо с текущего положения и масштаба камеры — никаких перелётов.
// Камера вращается вокруг вертикальной оси, проходящей через вершину (конечную точку маршрута).
function startOrbit() {
  const btn = document.getElementById("bOrbit");
  btn.classList.add("on"); btn.textContent = "Стоп ■";
  planet.stopFlying();
  orbiting = true; orbitStep();
}
document.getElementById("bOrbit").onclick = function () {
  if (orbiting) { stopOrbit(); return; }
  if (!orbitCenter) return;
  startOrbit();
};
// Пользователь трогает глобус — облёт выключается, чтобы не мешать
document.getElementById("globus").addEventListener("pointerdown", () => { if (orbiting) stopOrbit(); });

// ---- Наклон и расстояние камеры относительно вершины ----
// Обе ручки работают от вершины (конечной точки маршрута), а не от центра экрана:
//  • наклон — камера поворачивается вверх-вниз вокруг вершины, расстояние до неё не меняется;
//  • расстояние — камера едет прямо к вершине или от неё, угол не меняется.
// Ориентация камеры при этом не перестраивается, поэтому картинка не дёргается.
const TILT_MAX = 85, TILT_POW = 1.8;        // у ползунка наклона больше хода в диапазоне 0–30°
const tiltFromSlider = t => TILT_MAX * Math.pow(t / 1000, TILT_POW);
const sliderFromTilt = e => 1000 * Math.pow(Math.max(0, e) / TILT_MAX, 1 / TILT_POW);
const Z_MIN = 1000, Z_MAX = 120000;          // м, логарифмическая шкала
const zoomFromSlider = t => Z_MIN * Math.pow(Z_MAX / Z_MIN, t / 1000);
const sliderFromZoom = d => 1000 * Math.log(d / Z_MIN) / Math.log(Z_MAX / Z_MIN);

function elevationDeg() {
  const v = planet.camera.eye.sub(orbitCenter), n = orbitCenter.getNormal();
  return Math.asin(Math.max(-1, Math.min(1, v.dot(n) / v.length()))) * 180 / Math.PI;
}
const distToTop = () => planet.camera.eye.sub(orbitCenter).length();
const fmtDist = d => d >= 10000 ? Math.round(d / 1000) + " км" : (d / 1000).toFixed(1).replace(".", ",") + " км";

function showCamVals() {
  document.getElementById("tiltVal").textContent = Math.round(elevationDeg()) + "°";
  document.getElementById("zoomVal").textContent = fmtDist(distToTop());
}
function syncCam() {
  if (!orbitCenter) return;
  document.getElementById("tilt").value = sliderFromTilt(elevationDeg());
  document.getElementById("zoom").value = sliderFromZoom(Math.min(Z_MAX, Math.max(Z_MIN, distToTop())));
  showCamVals();
}
function applyTilt(targetDeg) {
  const cam = planet.camera;
  // поворачиваем вокруг вершины; пару шагов — чтобы точно прийти к нужному углу при любой ориентации
  for (let k = 0; k < 3; k++) {
    const before = elevationDeg(), delta = (targetDeg - before) * Math.PI / 180;
    if (Math.abs(delta) < 0.002) break;
    cam.rotateVertical(delta, orbitCenter); cam.update();
    if (Math.sign(elevationDeg() - before) !== Math.sign(delta)) { cam.rotateVertical(-2 * delta, orbitCenter); cam.update(); }
  }
}
function applyZoom(d) {
  const cam = planet.camera, v = cam.eye.sub(orbitCenter);
  cam.eye = orbitCenter.add(v.scale(d / v.length()));
  cam.update();
}
const tiltEl = document.getElementById("tilt"), zoomEl = document.getElementById("zoom");
let dragging = false;
[tiltEl, zoomEl].forEach(el => {
  el.addEventListener("pointerdown", () => { dragging = true; planet.stopFlying(); });
  el.addEventListener("change", () => { dragging = false; });
});
window.addEventListener("pointerup", () => { dragging = false; });
tiltEl.addEventListener("input", () => { if (orbitCenter) { applyTilt(tiltFromSlider(+tiltEl.value)); showCamVals(); } });
zoomEl.addEventListener("input", () => { if (orbitCenter) { applyZoom(zoomFromSlider(+zoomEl.value)); showCamVals(); } });
document.getElementById("bCam").onclick = function () {
  const p = document.getElementById("cam");
  p.hidden = !p.hidden;
  this.classList.toggle("on", !p.hidden);
  if (!p.hidden) syncCam();
};
// если камеру сдвинули пальцем или облётом — ползунки подстраиваются под неё
planet.camera.events.on("viewchange", () => {
  if (!dragging && !document.getElementById("cam").hidden) syncCam();
});

// ---- Диагностика: включаем/выключаем части сцены, чтобы найти источник мерцания ----
document.getElementById("bDiag").onclick = () => {
  const d = document.getElementById("diag"); d.hidden = !d.hidden;
};
document.getElementById("dFrames").onchange = (e) => {
  const on = e.target.checked;
  planet.setBaseLayer(on ? base : fullBase);
  mountainLayers.forEach(l => l.setVisibility(on));
};
document.getElementById("dTerrain").onchange = (e) => {
  planet.setTerrain(e.target.checked ? terrain : new EmptyTerrain());
};
document.getElementById("dAtmos").onchange = (e) => {
  planet.atmosphereEnabled = e.target.checked;
};
// Счётчик кадров в секунду
let frames = 0, fpsT = performance.now();
planet.renderer.events.on("postdraw", () => {
  frames++;
  const now = performance.now();
  if (now - fpsT > 1000) {
    document.getElementById("fps").textContent = "FPS: " + Math.round(frames * 1000 / (now - fpsT));
    frames = 0; fpsT = now;
  }
});

// Старт на Эльбрусе, после того как движок готов
setTimeout(() => goTo(0), 300);
</script>
</body>
</html>
