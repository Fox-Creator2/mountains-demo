<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Горы мира</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@openglobus/og@0.28.7/lib/og.css">
<style>
  /* Полноэкранный глобус, снизу панель с горами */
  :root {
    --panel: rgba(16, 20, 26, 0.86);
    --chip: #262d36;
    --chip-on: #d9a441;
    --fg: #eef1f4;
    --muted: #9aa5b1;
    --err: #ff7a6b;
  }
  html, body { margin: 0; height: 100%; background: #0b0e12; color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #globus { position: absolute; top: 0; left: 0; right: 0; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }

  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; gap: 8px;
  }
  #info { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
  #info b { font-size: 16px; }
  #info span { color: var(--muted); font-variant-numeric: tabular-nums; }

  #routes { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: -2px; }
  #routes::-webkit-scrollbar { display: none; }
  .rchip { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; border: 1px solid #3a4350; border-radius: 999px;
    padding: 4px 10px; background: transparent; color: var(--fg); font-size: 12px; cursor: pointer; }
  .rchip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .rchip.off { color: var(--muted); text-decoration: line-through; opacity: 0.6; }
  #chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 0; border-radius: 999px; padding: 9px 14px;
    background: var(--chip); color: var(--fg); font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--chip-on); color: #1a1407; font-weight: 600; }

  #ctrls { display: flex; gap: 6px; }
  #ctrls button { flex: 1; border: 0; border-radius: 10px; padding: 9px 6px;
    background: var(--chip); color: var(--fg); font-size: 13px; cursor: pointer; }
  #ctrls button.on { background: #3b6e4f; }

  #diag { position: absolute; left: 8px; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 25;
    background: var(--panel); border-radius: 10px; padding: 10px 12px; font-size: 13px;
    display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
  #diag[hidden] { display: none; }
  #cam { position: absolute; left: 12px; right: 12px; bottom: calc(168px + env(safe-area-inset-bottom, 0px)); z-index: 25;
    background: var(--panel); border-radius: 12px; padding: 8px 14px; display: flex; flex-direction: column; gap: 0; }
  #cam[hidden] { display: none; }
  #sun { position: absolute; left: 12px; right: 12px; bottom: calc(168px + env(safe-area-inset-bottom, 0px)); z-index: 25;
    background: var(--panel); border-radius: 12px; padding: 8px 14px; display: flex; flex-direction: column; gap: 0; }
  #sun[hidden] { display: none; }
  #sun .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); gap: 8px; }
  #sun .row b { color: var(--fg); font-variant-numeric: tabular-nums; }
  #sunTime, #sunDate { width: 100%; accent-color: var(--chip-on); height: 26px; margin: 0 0 4px; }
  #sun .mini { flex: 1; border: 0; border-radius: 8px; padding: 7px 8px; background: var(--chip); color: var(--fg); font-size: 12px; cursor: pointer; }
  #sun .mini.on { background: #3b6e4f; }
  #cam .reset { align-self: flex-end; border: 0; background: none; color: var(--muted); font-size: 12px;
    padding: 2px 0; cursor: pointer; text-decoration: underline; }
  #cam .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  #cam .row b { color: var(--fg); font-variant-numeric: tabular-nums; }
  #tilt, #zoom, #speed { width: 100%; accent-color: var(--chip-on); height: 26px; margin: 0 0 4px; }
  #diag .seg { display: flex; align-items: center; gap: 4px; }
  #diag .seg span { flex: 1; }
  #diag .seg button { border: 0; border-radius: 8px; padding: 6px 10px; background: var(--chip); color: var(--fg); font-size: 12px; cursor: pointer; }
  #diag .seg button.on { background: var(--chip-on); color: #1a1407; font-weight: 600; }
  #diag label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  #diag .fps { color: var(--muted); font-variant-numeric: tabular-nums; }
  #log { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 8px; right: 8px; z-index: 30;
    font: 12px/1.4 ui-monospace, monospace; color: var(--err); background: rgba(0,0,0,0.75);
    border-radius: 8px; padding: 6px 8px; white-space: pre-wrap; }
  #log:empty { display: none; }

</style>
</head>
<body>
<div id="globus"></div>
<div id="log"></div>

<div id="diag" hidden>
  <b>Настройки карты</b>
  <div class="seg" id="segImg"><span>Снимки</span><button data-v="bing">Bing</button><button data-v="esri">Esri</button></div>
  <a href="rc30/" style="color:var(--chip-on);font-size:12px">Версия на движке 1.0.0-rc30 — для сравнения</a>
  <b style="margin-top:6px">Диагностика</b>
  <label><input type="checkbox" id="dFrames" checked> Грубая подложка + рамки гор</label>
  <label><input type="checkbox" id="dTerrain" checked> Рельеф</label>
  <label><input type="checkbox" id="dAtmos"> Атмосфера</label>
  <span class="fps" id="fps">FPS: —</span>
  <span class="fps">Версия: 11.10, 15:30 · движок 0.28.7</span>
  <span class="fps" id="nodes">Узлов: —</span>
  <div class="fps" id="routeDbg" style="max-width:300px;white-space:pre-wrap;font-size:11px"></div>
</div>

<div id="sun" class="panel" hidden>
  <label class="row" style="color:var(--fg)"><span>Освещение по солнцу</span><input type="checkbox" id="sunOn"></label>
  <div class="row"><span>Местное солнечное время</span><b id="sunTimeVal">—</b></div>
  <input type="range" id="sunTime" min="0" max="1439" step="5" value="720">
  <div class="row"><span>Дата</span><b id="sunDateVal">—</b></div>
  <input type="range" id="sunDate" min="0" max="364" step="1" value="171">
  <div class="row"><button id="sunPlay" class="mini">▶ Сутки за 24 с</button><button id="sunNow" class="mini">Сейчас</button></div>
</div>

<div id="cam" hidden>
  <div class="row"><span>Наклон к горизонту · 0° сбоку, 85° сверху</span><b id="tiltVal">—</b></div>
  <input type="range" id="tilt" min="0" max="1000" step="1" value="400">
  <div class="row"><span>Расстояние до вершины</span><b id="zoomVal">—</b></div>
  <input type="range" id="zoom" min="0" max="1000" step="1" value="500">
  <div class="row"><span>Скорость облёта</span><b id="speedVal">—</b></div>
  <input type="range" id="speed" min="0" max="1000" step="1" value="500">
  <button id="camReset" class="reset">Сбросить настройки камеры</button>
</div>

<div id="bar">
  <div id="info"><b id="mName">Загрузка…</b><span id="mMeta"></span></div>
  <div id="routes"></div>
  <div id="chips"></div>
  <div id="ctrls">
    <button id="bMode">Телепорт</button>
    <button id="bOrbit">Облёт ⟳</button>
    <button id="bCam">Камера</button>
    <button id="bSun" style="flex:0 0 44px" aria-label="Солнце">☀</button>
    <button id="bDiag" style="flex:0 0 44px">⚙</button>
  </div>
</div>

<script>
  // Любая ошибка видна прямо на экране — удобно на телефоне без консоли
  const logEl = document.getElementById("log");
  const log = (m) => { logEl.textContent += m + "\n"; };
  window.addEventListener("error", e => log("Ошибка: " + e.message));
  window.addEventListener("unhandledrejection", e => log("Ошибка: " + (e.reason && e.reason.message || e.reason)));
</script>

//  • mountains — для каждой горы свой слой с extent: внутри рамки детальные тайлы, снаружи ничего не грузится;
//  • full — подложка без ограничений, для сравнения в диагностике.
function makeImagery(kind) {
  const make = (name, opts) => kind === "bing"
    ? new Bing(name, opts)
    : new XYZ(name, { url: ESRI, attribution: "Esri World Imagery", ...opts });
  const on = mapSettings.imagery === kind;
  return {
    base: make(kind + " низкое", { isBaseLayer: true, maxNativeZoom: 5, visibility: on }),
    full: make(kind + " полная", { isBaseLayer: true, maxNativeZoom: 17, visibility: false }),
    mountains: MOUNTAINS.map(m => make(kind + " " + m.name, {
      isBaseLayer: false, maxNativeZoom: 17, visibility: on, hideInLayerSwitcher: true, attribution: "",
      extent: [[m.lon - m.r, m.lat - m.r], [m.lon + m.r, m.lat + m.r]]
    }))
  };
}
const IMAGERY = { bing: makeImagery("bing"), esri: makeImagery("esri") };

Object.values(TERRAINS).forEach(t => {
  const orig = t.getHeightAsync.bind(t);
  t.getHeightAsync = function (lonLat, cb, ...rest) {
    if (!this._planet) { cb && cb(0); return true; }
    return orig(lonLat, cb, ...rest);
  };
});
const terrain = TERRAINS[mapSettings.terrain] || TERRAINS.globus;

  target: "globus",
  name: "Earth",
  terrain: terrain,
  layers: allImageryLayers,
  resourcesSrc: OG_RES,
  fontsSrc: OG_RES + "/fonts",
  atmosphereEnabled: false,          // атмосфера давала мерцание при облёте на телефоне
  transitionOpacityEnabled: false    // без плавной подмены тайлов — она даёт мигание при движении камеры
  // стартовый viewExtent не задаём: камеру ставим сами (иначе он может перебить её позже)
});
const planet = globus.planet;
window.planet = planet;   // для отладки из консоли браузера
// Загрузку и очистку плиток оставляем такими, как у движка по умолчанию — как в исходной версии на 0.28.7.

// ---------------- Маршруты восхождения ----------------
const ROUTE_LIFT = 12;     // подъём линии над рельефом, чтобы не тонула в склоне (depthOffset в 0.28.7 нет)
const LABEL_LIFT = 20;     // кружки точек — чуть над поверхностью
const TEXT_LIFT = 250;     // подписи — на «флагштоке» на 250 м выше самого высокого места в радиусе 400 м

// Сгущаем маршрут: точка каждые ~50 м, высота сначала линейная между ключевыми точками
function densify(route) {
  const out = [];
  for (let i = 0; i < route.length - 1; i++) {
    const [lo1, la1, h1] = route[i], [lo2, la2, h2] = route[i + 1];
    const dx = (lo2 - lo1) * 111320 * Math.cos(la1 * Math.PI / 180), dy = (la2 - la1) * 111320;
    const n = Math.max(1, Math.round(Math.hypot(dx, dy) / 50));
    for (let k = 0; k < n; k++) {
      const t = k / n;
      out.push([lo1 + (lo2 - lo1) * t, la1 + (la2 - la1) * t, h1 + (h2 - h1) * t, k === 0 ? i : -1, i]);
    }
  }
  const last = route[route.length - 1];
  out.push([last[0], last[1], last[2], route.length - 1, route.length - 2]);
  return out;   // [lon, lat, h, индекс ключевой точки или -1, номер отрезка]
}

// Цвета маршрутов: первый — основной, остальные по порядку
const ROUTE_COLORS = ["#ff5a2e", "#3fa9ff", "#6fdc4a", "#c77dff", "#ffd23f"];

// Кружок для отметки точки маршрута
function dot(color) {
  const c = document.createElement("canvas"); c.width = c.height = 32;
  const g = c.getContext("2d");
  g.beginPath(); g.arc(16, 16, 12, 0, Math.PI * 2);
  g.fillStyle = color; g.fill(); g.lineWidth = 4; g.strokeStyle = "#ffffff"; g.stroke();
  return c.toDataURL();
}
const DOTS = ROUTE_COLORS.map(dot), DOT_TOP = dot("#ffc533");

// depthOffset: при отрисовке линии и метки сдвигаются на 20 м к камере — так они не проваливаются под рельеф
// (совет автора OpenGlobus). Поэтому собственный подъём над поверхностью теперь небольшой.
const routeLayer = new Vector("Маршруты", {
  pickingEnabled: false, hideInLayerSwitcher: true, polygonOffsetUnits: -4, depthOffset: -20
});
planet.addLayer(routeLayer);
// Подписи — в отдельном слое с более сильным сдвигом к камере: тонкий гребень перед подписью её не перережет
const labelLayer = new Vector("Подписи", {
  pickingEnabled: false, hideInLayerSwitcher: true, depthOffset: -250
});
planet.addLayer(labelLayer);

// Точки, общие для нескольких маршрутов (вершина, седловина, слияние троп), подписываем один раз
function nearLabeled(labeled, p) {
  return labeled.some(q => Math.abs(q[0] - p[0]) * 111320 * Math.cos(p[1] * Math.PI / 180) < 150 && Math.abs(q[1] - p[1]) * 111320 < 150);
}

MOUNTAINS.forEach(m => {
  const labeled = [];
  m.routes.forEach((rt, ri) => {
    rt.color = ROUTE_COLORS[ri % ROUTE_COLORS.length];
    rt.visible = true;
    rt.dense = densify(rt.pts);
    rt.line = new Entity({
      polyline: { pathLonLat: [rt.dense.map(p => [p[0], p[1], p[2] + ROUTE_LIFT])], thickness: 4, color: rt.color }
    });
    routeLayer.add(rt.line);
    rt.points = rt.pts.map((p, i) => {
      if (nearLabeled(labeled, p)) return null;      // эту точку уже подписал другой маршрут
      labeled.push(p);
      const top = i === rt.pts.length - 1;
      // кружок — у самой поверхности, подпись — отдельно и повыше, чтобы не врезалась в склон
      const e = new Entity({
        lonlat: [p[0], p[1], p[2] + LABEL_LIFT],
        billboard: { src: top ? DOT_TOP : DOTS[ri % DOTS.length], size: [14, 14] }
      });
      e.textEntity = new Entity({
        lonlat: [p[0], p[1], p[2] + TEXT_LIFT],
        label: {
          text: p[3] + ", " + p[2] + " м",
          size: top ? 15 : 13, color: "#ffffff", outline: 0.28, outlineColor: "rgba(0,0,0,0.85)",
          offset: [8, 0]
        }
      });
      // для кластеризации подписей: текст, размер шрифта и важность (вершина важнее, выше — важнее)
      e.labelInfo = { len: (p[3] + ", " + p[2] + " м").length, size: top ? 15 : 13, prio: (top ? 100000 : 0) + p[2], rt };
      e.labelShown = true;
      // «флагшток»: тонкая вертикальная линия от точки маршрута вверх к подписи
      e.stalk = new Entity({ polyline: {
        pathLonLat: [[[p[0], p[1], p[2]], [p[0], p[1], p[2] + TEXT_LIFT]]], thickness: 1.5, color: "rgba(255,255,255,0.75)" } });
      routeLayer.add(e);
      routeLayer.add(e.stalk);
      labelLayer.add(e.textEntity);
      return e;
    });
  });
});

function setRouteVisible(rt, on) {
  rt.visible = on;
  rt.line.setVisibility(on);
  rt.points.forEach(e => { if (e) { e.setVisibility(on); e.labelShown = on; e.textEntity.setVisibility(on); e.stalk.setVisibility(on); } });
  declutterLabels();
}

// Уточняем высоты по настоящему рельефу — для маршрутов выбранной горы и только один раз
// Высоты рельефа для набора точек — все запросы разом (плитки рельефа движок грузит один раз и кэширует).
// zoom: для перебора вариантов (подгонка точек, обходы) берём более крупные плитки SEARCH_ZOOM —
// их в разы меньше, и ответ приходит быстрее; окончательную линию кладём по самым подробным.
const SEARCH_ZOOM = 12;
const DRAPE_ZOOM = 13;   // окончательная линия: шаг рельефа ~10–20 м, а плиток вчетверо меньше, чем на самом подробном зуме
const hCache = new Map();
function heightAt(lon, lat, zoom) {
  if (window.__heightStub) return window.__heightStub(lon, lat);   // для проверок без сети
  const key = (zoom || 0) + ":" + lon.toFixed(5) + ":" + lat.toFixed(5);
  if (hCache.has(key)) return hCache.get(key);
  const ll = new LonLat(lon, lat);
  // Если подробной плитки рельефа нет (рельеф вернул 0), пробуем всё более крупные плитки.
  // Это важно севернее 60° (Денали): подробные данные рельефа там есть не везде.
  const pr = new Promise(res => {
    const t = planet.terrain;
    if (!t || !t.getHeightAsync) return res(NaN);
    const geo = t.geoid ? t.geoid.getHeightLonLat(ll) : 0;
    // после смены рельефа старый объект отвязан от планеты — его запросы прекращаем
    const tryZ = z => !t._planet ? res(NaN) : t.getHeightAsync(ll, h => {
      if (h !== 0 && isFinite(h)) return res(h + geo);
      const next = (z || t.maxZoom || 14) - 2;
      if (next >= 6) tryZ(next); else res(NaN);
    }, z);
    tryZ(zoom);
  });
  if (hCache.size > 50000) hCache.clear();   // проверки видимости подписей при облёте рождают много новых точек
  hCache.set(key, pr);
  return pr;
}
async function heightsAt(points, zoom) {
  return Promise.all(points.map(p => heightAt(p[0], p[1], zoom)));
}
// точки отрезка через каждые ~50 м, но не больше 60 (без концов) — чтобы перебор на длинных отрезках не тормозил
function sampleLine(a, b, kx, ky) {
  const L = Math.hypot((b[0] - a[0]) * kx, (b[1] - a[1]) * ky), n = Math.min(60, Math.max(2, Math.round(L / 50))), out = [];
  for (let k = 1; k < n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
  return { pts: out, L };
}

// Автообход провалов на пеших отрезках.
// Ключевые точки маршрутов грубые, и прямая между двумя соседними точками иногда срезает угол через ущелье
// или обрыв, которые настоящая тропа обходит (так было у Ай-Петри между верхней станцией и зубцами).
// Если линия проваливается глубже DIP_LIMIT ниже нижнего из концов, перебираем промежуточные точки сбоку
// от прямой и берём ту, через которую путь идёт ровнее (без провала и без лишнего подъёма на гребни).
const DIP_LIMIT = 80;

// Подгонка ключевых точек по известной высоте — вдоль маршрута.
// Высоты станций, хижин и лагерей известны хорошо, а координаты — грубо. Если рельеф в точке отличается
// от её высоты больше чем на SNAP_TOL (точка висит в воздухе перед обрывом или ушла под склон),
// двигаем её вдоль самого маршрута: сначала вперёд — к следующей точке, потом назад — к предыдущей,
// шагом SNAP_STEP, и останавливаемся там, где рельеф впервые выходит на нужную высоту
// (точно в месте пересечения, чтобы точка легла на поверхность, а не внутрь склона).
// Вперёд предпочтительнее: назад берём, только если вперёд подходящего места нет или оно вдвое дальше.
const SNAP_TOL = 30, SNAP_STEP = 10, SNAP_MAX = 2000;
async function snapPoints(rt) {
  const P = rt.pts, kx = 111320 * Math.cos(P[0][1] * Math.PI / 180), ky = 111320;
  const hs = await heightsAt(P, SEARCH_ZOOM);
  const out = P.map(p => p.slice());
  const report = [];
  let moved = 0;
  // ищем вдоль направления from → to первое место, где рельеф пересекает высоту target
  const searchAlong = async (from, to, target, h0) => {
    const L = Math.hypot((to[0] - from[0]) * kx, (to[1] - from[1]) * ky);
    const maxD = Math.min(SNAP_MAX, L * 0.9);
    const ds = [];
    for (let d = SNAP_STEP; d <= maxD; d += SNAP_STEP) ds.push(d);
    if (!ds.length) return null;
    const at = d => [from[0] + (to[0] - from[0]) * d / L, from[1] + (to[1] - from[1]) * d / L];
    const hh = await heightsAt(ds.map(at), SEARCH_ZOOM);
    let prevD = 0, prevH = h0;
    for (let k = 0; k < ds.length; k++) {
      const h = hh[k]; if (!isFinite(h)) return null;
      if (Math.abs(h - target) <= SNAP_TOL || Math.sign(h - target) !== Math.sign(prevH - target)) {
        // уточняем место пересечения между соседними шагами
        const f = (prevH === h) ? 1 : Math.min(1, Math.max(0, (target - prevH) / (h - prevH)));
        const d = prevD + (ds[k] - prevD) * f;
        return { d, pos: at(d) };
      }
      prevD = ds[k]; prevH = h;
    }
    return null;
  };
  await Promise.all(P.map(async (p, i) => {
    const h = hs[i];
    if (!isFinite(h)) { report[i] = p[3] + ": рельеф не загрузился"; return; }
    if (Math.abs(h - p[2]) <= SNAP_TOL) return;
    const [fwd, back] = await Promise.all([
      i < P.length - 1 ? searchAlong(p, P[i + 1], p[2], h) : null,
      i > 0 ? searchAlong(p, P[i - 1], p[2], h) : null ]);
    const pick = fwd && (!back || fwd.d <= back.d * 2) ? { ...fwd, dir: "вперёд" } : back ? { ...back, dir: "назад" } : null;
    if (pick) {
      out[i] = [pick.pos[0], pick.pos[1], p[2], p[3]]; moved++;
      report[i] = p[3] + ": рельеф " + Math.round(h) + " м вместо " + p[2] + " → сдвинута " + pick.dir + " по маршруту на " + Math.round(pick.d) + " м";
    } else {
      report[i] = p[3] + ": рельеф " + Math.round(h) + " м вместо " + p[2] + ", вдоль маршрута нужной высоты не нашлось";
    }
  }));
  rt.snapReport = report.filter(Boolean);
  return { pts: out, moved };
}

async function findDetours(rt, P) {
  const air = new Set(rt.air || []);
  const kx = 111320 * Math.cos(P[0][1] * Math.PI / 180), ky = 111320;
  const ends = await heightsAt(P, SEARCH_ZOOM);
  const pts = [], orig = [], airEff = [], bridges = [];
  for (let s = 0; s < P.length; s++) {
    if (air.has(s)) airEff.push(pts.length);
    pts.push(P[s]); orig.push(s);
    if (s === P.length - 1 || air.has(s)) continue;
    const A = P[s], B = P[s + 1], ha = ends[s], hb = ends[s + 1];
    if (!(isFinite(ha) && isFinite(hb))) continue;
    const base = Math.min(ha, hb), top = Math.max(ha, hb);
    const straight = sampleLine(A, B, kx, ky);
    const hsS = await heightsAt(straight.pts, SEARCH_ZOOM);
    const dip0 = base - Math.min(...hsS);
    if (!(dip0 > DIP_LIMIT)) continue;
    // перебор: точка на 35/50/65% пути, сдвиг вбок до 1,2 км
    const ux = (B[0] - A[0]) * kx / straight.L, uy = (B[1] - A[1]) * ky / straight.L;
    const cands = [];
    for (const t of [0.35, 0.5, 0.65]) for (const d of [-1200, -800, -500, -300, -150, 150, 300, 500, 800, 1200]) {
      cands.push([A[0] + (B[0] - A[0]) * t + (-uy * d) / kx, A[1] + (B[1] - A[1]) * t + (ux * d) / ky]);
    }
    const scored = await Promise.all(cands.map(async C => {
      const s1 = sampleLine(A, C, kx, ky), s2 = sampleLine(C, B, kx, ky);
      const hh = await heightsAt([...s1.pts, C, ...s2.pts], SEARCH_ZOOM);
      if (hh.some(h => !isFinite(h))) return null;
      const dip = Math.max(0, base - Math.min(...hh)), over = Math.max(0, Math.max(...hh) - top - 30);
      return { cost: dip + over + 0.03 * (s1.L + s2.L - straight.L), C, h: hh[s1.pts.length] };
    }));
    let best = null;
    scored.forEach(r => { if (r && (!best || r.cost < best.cost)) best = r; });
    if (best && best.cost < dip0 * 0.5) { pts.push([best.C[0], best.C[1], best.h, ""]); orig.push(-1); }
    // обойти не удалось — оставляем по рельефу. Раньше такой отрезок проводился поверху прямой, но на длинных
    // отрезках через настоящие долины (Демерджи, от Ангарского перевала) линия повисала в воздухе.
    // Узкие V-образные провалы теперь всё равно засыпает эвристика «без нырков» ниже.
  }
  return { pts, orig, air: airEff, bridges };
}

let drapeGen = 0;   // растёт при смене рельефа — незаконченная укладка по старому рельефу начинается заново
async function drapeRoute(rt, mountainName) {
  if (rt.draped || rt.draping) return;
  rt.draping = true;
  const gen = drapeGen;
  const T0 = performance.now();
  try {
    const snapped = await snapPoints(rt);
    const eff = await findDetours(rt, snapped.pts);
    const pts = eff.pts, dense = densify(pts);
    const hs = await heightsAt(dense, DRAPE_ZOOM);
    // Высота каждой точки линии — по рельефу. Высоты ключевых точек в данных грубые, поэтому им не верим:
    //  • пешие отрезки и все станции/точки маршрута лежат на поверхности (если линия «задрана», она прижимается);
    //  • отрезки по воздуху (канатная дорога) — прямая между станциями, а станции стоят на рельефе;
    //    если такая прямая где-то ушла под землю — поднимаем её над поверхностью;
    //  • если рельеф в точке не загрузился (вернул 0 или мусор) — берём расчётную высоту.
    const air = new Set(eff.air);
    const dbg = { t0: T0, noTerrain: 0, moved: snapped.moved, detours: eff.pts.length - rt.pts.length, bridges: eff.bridges.length, filled: 0, spans: [] };
    const ground = dense.map((p, i) => {
      const h = hs[i];
      // раньше здесь отбрасывались высоты намного ниже расчётной — и линия над настоящими глубокими долинами
      // (Демерджи: поляна → Северная Демерджи) оставалась висеть по прямой. Пустые плитки heightAt и так
      // отсеивает (возвращает NaN), поэтому верим любой полученной высоте.
      if (isFinite(h)) return h;
      dbg.noTerrain++; return p[2];
    });
    // Воздушные отрезки (канатная дорога): трос — плавная кривая от станции к станции.
    //  1) концы ставим на рельеф, но если прямая между ними задевает склон (например, перегиб у края
    //     обрыва), приподнимаем конец ровно настолько, чтобы трос прошёл над склоном с запасом CLEAR —
    //     так не получается «невидимого столба», когда линия карабкается по склону, а потом уходит в пропасть;
    //  2) добавляем провисание по параболе: до 4% длины пролёта, но не больше, чем позволяет рельеф под тросом.
    const CLEAR = 15, SAG = 0.04;
    const fixed = ground.slice(), onCable = new Set();
    const kx = 111320 * Math.cos(pts[0][1] * Math.PI / 180), ky = 111320;
    // отрезки, которые не удалось обойти: линия не опускается ниже прямой между концами (на 10 м)
    for (const seg of eff.bridges) {
      const idx = [];
      dense.forEach((p, i) => { if (p[4] === seg || (p[3] === seg + 1)) idx.push(i); });
      const hA = ground[idx[0]], hB = ground[idx[idx.length - 1]];
      idx.forEach((i, k) => { const u = k / (idx.length - 1); fixed[i] = Math.max(ground[i], hA + (hB - hA) * u - 10); });
    }
    for (const seg of air) {
      const idx = [];
      dense.forEach((p, i) => { if (p[4] === seg || (p[3] === seg + 1)) idx.push(i); });
      if (idx.length < 2) continue;
      const i0 = idx[0], i1 = idx[idx.length - 1];
      const [lo1, la1] = pts[seg], [lo2, la2] = pts[seg + 1];
      const L = Math.hypot((lo2 - lo1) * kx, (la2 - la1) * ky) || 1;
      const tt = idx.map(i => Math.hypot((dense[i][0] - lo1) * kx, (dense[i][1] - la1) * ky) / L);
      const g0 = ground[i0], g1 = ground[i1];
      // Если склон у верхней станции встаёт круче, чем прямая к ней (станция стоит за краем обрыва),
      // трос заканчиваем на краю — там, куда «смотрит» самый крутой луч от нижней станции, —
      // а дальше до станции линия идёт по земле. Так устроены настоящие канатки: станция на бровке.
      let jEnd = idx.length - 1, hEnd = g1;
      let bestS = (g1 - g0) / L;
      idx.forEach((i, k) => {
        const t = tt[k]; if (t < 0.6 || t > 0.999) return;
        if (ground[i] < g0 + (g1 - g0) * t + CLEAR) return;   // склон здесь ниже прямой — всё в порядке
        const sl = (ground[i] + CLEAR - g0) / (t * L);
        if (sl > bestS) { bestS = sl; jEnd = k; hEnd = ground[i] + CLEAR; }
      });
      // Каждый воздушный отрезок — один пролёт без опор: плавная кривая от станции до станции (или до бровки)
      // с провисанием до 4% длины. Провисание уменьшается, если иначе трос задел бы склон. Никаких изломов:
      // если склон торчит выше даже прямой (редкий случай грубых точек), трос всё равно рисуется гладким.
      const clr = u => CLEAR * Math.min(1, u / 0.1, (1 - u) / 0.1);
      const span = (kA, kB, hA, hB) => {
        const tA = tt[kA], tB = tt[kB], dt = (tB - tA) || 1;
        let sag = SAG * L * dt;
        for (let k = kA + 1; k < kB; k++) {
          const u = (tt[k] - tA) / dt, w = 4 * u * (1 - u);
          if (w > 0.05) sag = Math.min(sag, Math.max(0, (hA + (hB - hA) * u - ground[idx[k]] - clr(u)) / w));
        }
        let above = 0;
        for (let k = kA + 1; k < kB; k++) {
          const u = (tt[k] - tA) / dt;
          fixed[idx[k]] = hA + (hB - hA) * u - 4 * sag * u * (1 - u);
          onCable.add(idx[k]);
          above = Math.max(above, fixed[idx[k]] - ground[idx[k]]);
        }
        return { sag, above };
      };
      fixed[i0] = g0;
      const tEnd = tt[jEnd];
      const r = span(0, jEnd, g0, hEnd);
      dbg.spans.push({ len: Math.round(L * tEnd), sag: Math.round(r.sag), above: Math.round(r.above),
        edge: jEnd < idx.length - 1, g0: Math.round(g0), g1: Math.round(g1), hEnd: Math.round(hEnd) });
      fixed[idx[jEnd]] = hEnd;
      for (let k = jEnd + 1; k < idx.length; k++) fixed[idx[k]] = ground[idx[k]];   // после бровки — по земле
    }
    // Эвристика «без нырков»: узкие глубокие провалы в линии засыпаем.
    // Тропа не ныряет на сотни метров вниз, чтобы через несколько сотен метров выбраться обратно, —
    // такой V-образный провал почти всегда значит, что прямая между грубыми точками срезала угол над ущельем.
    // Считаем «закрытие» профиля окном ±DIP_WIN точек (≈ ±300 м): сначала максимум по окну, потом минимум.
    // Оно заполняет только провалы уже окна и не трогает обычные подъёмы и спуски. Где провал глубже
    // DIP_FILL, линия идёт по закрытому профилю (поверху), в остальных местах — как раньше по рельефу.
    {
      const DIP_WIN = 6, DIP_FILL = 80, n = fixed.length, P = 2 * DIP_WIN;
      // края профиля продлеваем крайними значениями, иначе у начала и конца маршрута закрытие даёт ложный подъём
      const f = [...Array(P).fill(fixed[0]), ...fixed, ...Array(P).fill(fixed[n - 1])];
      const win = (arr, k, op) => { let m = op === "max" ? -Infinity : Infinity;
        for (let j = Math.max(0, k - DIP_WIN); j <= Math.min(arr.length - 1, k + DIP_WIN); j++) m = op === "max" ? Math.max(m, arr[j]) : Math.min(m, arr[j]);
        return m; };
      const dil = f.map((_, k) => win(f, k, "max"));
      const cloP = dil.map((_, k) => win(dil, k, "min"));
      const clo = cloP.slice(P, P + n);
      for (let k = 0; k < n; k++) if (!onCable.has(k) && clo[k] - fixed[k] > DIP_FILL) { fixed[k] = clo[k]; dbg.filled++; }
    }
    rt.line.polyline.setPathLonLat([dense.map((p, i) => [p[0], p[1], fixed[i] + ROUTE_LIFT])]);
    dense.forEach((p, i) => {
      const o = p[3] >= 0 ? eff.orig[p[3]] : -1;
      if (o >= 0 && rt.points[o]) {
        rt.points[o].setLonLat(new LonLat(p[0], p[1], fixed[i] + LABEL_LIFT));
        rt.points[o].labelPos = [p[0], p[1], fixed[i]];
      }
    });
    await placeLabels(rt);
    if (gen !== drapeGen) { rt.redo = true; return; }
    rt.draped = true;
    dbg.ms = Math.round(performance.now() - dbg.t0);
    rt.dbg = dbg;
    showRouteDbg();
  } catch (e) {
    log("Маршрут «" + rt.name + "» (" + mountainName + "): не удалось уточнить высоты (" + e.message + ")");
  } finally {
    rt.draping = false;
    if (rt.redo) { rt.redo = false; drapeRoute(rt, mountainName); }
  }
}

window.__dbg = { MOUNTAINS, drapeRoute };

// Что получилось при раскладке маршрутов выбранной горы по рельефу — видно в панели ⚙
function showRouteDbg() {
  const el = document.getElementById("routeDbg"); if (!el || !current) return;
  el.textContent = current.routes.map(rt => {
    if (!rt.dbg) return "• " + rt.name + ": " + (rt.draping ? "считается…" : "ещё не уложен на рельеф");
    const d = rt.dbg;
    let t = "• " + rt.name + ": уложен за " + d.ms + " мс";
    if (d.noTerrain) t += ", без рельефа " + d.noTerrain + " точ.";
    if (d.moved) t += ", подогнано по высоте точек: " + d.moved;
    (rt.snapReport || []).forEach(line => { t += "\n   ◦ " + line; });
    if (d.detours) t += ", обходов " + d.detours;
    if (d.bridges) t += ", поверху отрезков " + d.bridges;
    if (d.filled) t += ", засыпано провалов " + d.filled + " точ.";
    d.spans.forEach((sp, i) => {
      t += "\n   пролёт " + (i + 1) + ": " + sp.len + " м, станции " + sp.g0 + "→" + sp.g1 + " м" +
        (sp.edge ? ", трос до бровки " + sp.hEnd + " м" : "") + ", провис " + sp.sag + " м, макс. над склоном " + sp.above + " м";
    });
    return t;
  }).join("\n");
}   // для отладки из консоли браузера

// ---- Подписи точек ----
// 1) Базовая высота подписи — над самым высоким местом рельефа в радиусе ~300 м вокруг точки (+TEXT_LIFT),
//    а не над самой точкой: иначе на склоне подпись утыкается в гору выше по склону.
// 2) Подпись стоит на «флагштоке» — вертикальной линии от точки маршрута. Отдельный слой подписей сдвинут
//    к камере (depthOffset), поэтому склоны перед подписью её не перерезают. Во время движения камеры
//    ничего не пересчитываем и рельеф не запрашиваем — фон не подгружается.
async function placeLabels(rt) {
  const kx = 111320 * Math.cos(rt.pts[0][1] * Math.PI / 180), ky = 111320;
  await Promise.all(rt.points.map(async e => {
    if (!e || !e.labelPos) return;
    const [lon, lat, h] = e.labelPos, ring = [];
    for (const r of [100, 250, 400]) for (let a = 0; a < 360; a += 30) {
      ring.push([lon + r * Math.cos(a * Math.PI / 180) / kx, lat + r * Math.sin(a * Math.PI / 180) / ky]);
    }
    // зум как у линии: на грубых плитках острые гребни сглажены, и подпись оказывалась ниже настоящего склона
    const hh = (await heightsAt(ring, DRAPE_ZOOM)).filter(isFinite);
    e.labelBase = Math.max(h, ...hh) + TEXT_LIFT;
    e.textEntity.setLonLat(new LonLat(lon, lat, e.labelBase));
    e.stalk.polyline.setPathLonLat([[[lon, lat, h + LABEL_LIFT], [lon, lat, e.labelBase]]]);
  }));
}


// Фоновая укладка: когда выбранная гора готова, по одной укладываем остальные горы,
// чтобы при переключении маршруты сразу лежали на рельефе.
let bgRunning = false;
function scheduleBackgroundDrape() {
  // Фоновая укладка маршрутов других гор отключена: она качала рельеф всех гор и отнимала сеть у выбранной.
  // Маршруты укладываются при выборе горы — это быстро, а уложенные запоминаются до перезагрузки страницы.
}

// ---- Кластеризация подписей ----
// Подписи, которые на экране налезают друг на друга, прячем, оставляя более важную: вершину, затем более высокие
// точки. Кружки точек остаются. При приближении места становится больше — скрытые подписи возвращаются.
// Пересчёт — 5 раз в секунду в цикле отрисовки, для подписей всех гор; подписи выбранной горы в приоритете.
let declutterT = 0;
function declutterLabels() {
  if (!current) return;
  const cam = planet.camera, fwd = cam.getForward(), dpr = window.devicePixelRatio || 1;
  const items = [];
  // все горы сразу: издалека подписи соседних гор (например, крымских) тоже не должны налезать;
  // подписи выбранной горы важнее остальных
  MOUNTAINS.forEach(m => m.routes.forEach(rt => rt.points.forEach(e => {
    if (!e || !e.labelInfo) return;
    if (!rt.visible) { e.labelShown = false; return; }
    const c = e.textEntity.getCartesian();
    const toEye = cam.eye.sub(c);
    if (c.sub(cam.eye).dot(fwd) <= 0 ||                                   // за спиной камеры
        toEye.dot(planet.ellipsoid.getSurfaceNormal3v(c)) <= 0 ||          // за горизонтом
        toEye.length() > 250000) { setLabel(e, false); return; }           // дальше 250 км — мелко и не нужно
    const px = planet.getPixelFromCartesian(c);
    if (!px) return;
    const x = px.x / dpr, y = px.y / dpr, info = e.labelInfo;
    const w = info.len * info.size * 0.56 + 12, h = info.size + 6;
    items.push({ e, prio: info.prio + (m === current ? 1e6 : 0), r: [x + 6, y - h / 2, x + 6 + w, y + h / 2] });
  })));
  items.sort((a, b) => b.prio - a.prio);
  const kept = [];
  for (const it of items) {
    const hit = kept.some(k => !(it.r[2] < k[0] || it.r[0] > k[2] || it.r[3] < k[1] || it.r[1] > k[3]));
    setLabel(it.e, !hit);
    if (!hit) kept.push(it.r);
  }
}
function setLabel(e, on) {
  if (e.labelShown === on) return;
  e.labelShown = on;
  e.textEntity.setVisibility(on);
  e.stalk.setVisibility(on);
}
planet.renderer.events.on("postdraw", () => {
  const now = performance.now();
  if (now - declutterT < 200) return;
  declutterT = now;
  declutterLabels();
});

// Список маршрутов выбранной горы под её названием: цветная метка, тап — скрыть/показать маршрут
function renderRouteList(m) {
  const box = document.getElementById("routes");
  box.innerHTML = "";
  m.routes.forEach(rt => {
    const b = document.createElement("button");
    b.className = "rchip" + (rt.visible ? "" : " off");
    b.innerHTML = '<i style="background:' + rt.color + '"></i>';
    b.appendChild(document.createTextNode(rt.name));
    b.onclick = () => { setRouteVisible(rt, !rt.visible); b.classList.toggle("off", !rt.visible); };
    box.appendChild(b);
  });
}

// Камера стоит позади начала маршрута и чуть сбоку и смотрит на вершину:
// на вертикальном экране путь идёт снизу вверх к вершине в центре кадра.
// Облёт, наклон и приближение работают относительно вершины, поэтому она сразу в центре.
// ---- Настройки камеры: сохраняются при переключении гор и между заходами на страницу ----
const DEFAULTS = { tilt: 22, speed: 2 * Math.PI / 20, dist: null };   // 22°, круг за 20 с, расстояние — авто
const SETTINGS_KEY = "mountains-demo-settings-v1";
const settings = { ...DEFAULTS };
try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); } catch (e) {}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
}
function cameraFor(m) {
  // Откуда смотреть по умолчанию: позади начала основного маршрута и чуть сбоку, чтобы путь шёл снизу вверх к вершине.
  // Возвращаем курс камеры (куда она смотрит, от севера по часовой) и расстояние до вершины.
  const r = m.route, s0 = r[0], top = r[r.length - 1];
  const kx = 111320 * Math.cos(m.lat * Math.PI / 180), ky = 111320;
  const dx = (top[0] - s0[0]) * kx, dy = (top[1] - s0[1]) * ky;
  const len = Math.max(Math.hypot(dx, dy), 1500);
  const ux = dx / len, uy = dy / len;                    // направление «старт → вершина»
  const back = len * 0.5 + Math.max(4000, len * 0.55);  // отход назад от середины маршрута
  const side = len * 0.25;                               // небольшой сдвиг вбок для объёма
  const ox = -dx / 2 - ux * back + uy * side, oy = -dy / 2 - uy * back - ux * side;   // камера относительно вершины, м
  const hd0 = Math.hypot(ox, oy);
  return {
    heading: Math.atan2(-ox, -oy) * 180 / Math.PI,      // смотрим с камеры на вершину
    dist: settings.dist || Math.hypot(hd0, Math.max(3000, len * 0.55))
  };
}

// ---- Камера: курс, наклон и расстояние относительно вершины ----
// Положение камеры задаётся тремя числами относительно вершины выбранной горы:
//   heading — куда смотрит камера (азимут от севера по часовой, °), elev — угол над горизонтом (°), dist — расстояние (м).
// Ориентацию ставим через camera.set(глаз, точка взгляда, верх) с «верхом» = нормалью к поверхности в точке камеры.
// Движок строит боковой вектор как верх × назад, значит он всегда перпендикулярен нормали — горизонт ровный
// по построению, без крена. Облёт, наклон и расстояние просто меняют эти три числа.
const camState = { heading: 0, elev: 22, dist: 10000 };
let summit = null, E = null, N = null, U = null;   // вершина и локальный базис «восток, север, вверх» в ней
function setSummit(top) {
  summit = planet.ellipsoid.lonLatToCartesian(new LonLat(top[0], top[1], top[2]));
  U = planet.ellipsoid.getSurfaceNormal3v(summit);
  const east = planet.ellipsoid.lonLatToCartesian(new LonLat(top[0] + 0.001, top[1], top[2])).sub(summit);
  E = east.sub(U.scaleTo(east.dot(U))).normalize();
  N = U.cross(E).normalize();
}
function eyeFromState() {
  const h = camState.heading * Math.PI / 180, el = camState.elev * Math.PI / 180;
  const view = E.scaleTo(Math.sin(h)).add(N.scaleTo(Math.cos(h)));           // горизонтальное направление взгляда
  const toEye = view.scaleTo(-Math.cos(el)).add(U.scaleTo(Math.sin(el)));    // от вершины к камере
  return summit.add(toEye.scaleTo(camState.dist));
}
function stateFromEye() {
  const v = planet.camera.eye.sub(summit), d = v.length(), up = v.dot(U);
  const hv = v.sub(U.scaleTo(up));
  camState.dist = d;
  camState.elev = Math.asin(Math.max(-1, Math.min(1, up / d))) * 180 / Math.PI;
  camState.heading = Math.atan2(-hv.dot(E), -hv.dot(N)) * 180 / Math.PI;
}
function applyCam(look) {
  const eye = eyeFromState();
  planet.camera.set(eye, look || summit, planet.ellipsoid.getSurfaceNormal3v(eye));
  planet.camera.update();
}
// смотрит ли камера сейчас на вершину (после того как её двигали пальцем — обычно нет)
function looksAtSummit() {
  const to = summit.sub(planet.camera.eye).normalize();
  return to.dot(planet.camera.getForward()) > Math.cos(1.5 * Math.PI / 180);
}

let current = null, flyMode = false, orbiting = false, orbitCenter = null, orbitUp = null;

function goTo(i) {
  const m = MOUNTAINS[i];
  current = m;
  const keepOrbit = orbiting;                      // если облёт шёл — продолжим его на новой горе
  orbiting = false;
  // облёт, наклон и расстояние — относительно конечной точки подъёма (вершины маршрута)
  const top = m.route[m.route.length - 1];
  setSummit(top);
  orbitCenter = summit; orbitUp = U;
  const c = cameraFor(m);
  camState.heading = c.heading; camState.dist = c.dist; camState.elev = settings.tilt;
  planet.stopFlying();
  if (flyMode) {
    const eye = eyeFromState();
    planet.flyCartesian(eye, { look: summit, up: planet.ellipsoid.getSurfaceNormal3v(eye), duration: 2500,
      completeCallback: () => {
        if (current !== m) return;
        applyCam();                                  // точно ставим по курсу/наклону/расстоянию
        if (keepOrbit) { orbiting = true; orbitStep(); }
      } });
  } else {
    applyCam();                                      // мгновенно, без анимации
    if (keepOrbit) { orbiting = true; orbitStep(); }
  }
  document.getElementById("mName").textContent = m.name;
  const n = m.routes.length;
  document.getElementById("mMeta").textContent =
    m.h.toLocaleString("ru-RU") + " м · " + n + " " + (n === 1 ? "маршрут" : n < 5 ? "маршрута" : "маршрутов");
  renderRouteList(m);
  showRouteDbg();
  Promise.all(m.routes.map(rt => drapeRoute(rt, m.name))).then(scheduleBackgroundDrape);
  document.querySelectorAll(".chip").forEach((c, k) => c.classList.toggle("on", k === i));
  if (typeof applySun === "function" && sunState.on) applySun();
}

let orbitSpeed = settings.speed;   // рад/с; меняется ползунком в панели «Камера»
const ORBIT_RAMP = 1.5;     // с — плавный разгон, чтобы облёт не начинался рывком
let lastT = 0, orbitT = 0, lookFrom = null;
// Облёт: курс камеры растёт, наклон и расстояние постоянны — камера идёт по кругу вокруг вершины.
// Шаг делается внутри цикла отрисовки (postdraw). Если камера смотрела не на вершину (её сдвигали пальцем),
// за время разгона взгляд плавно переводится на вершину — без скачка.
planet.renderer.events.on("postdraw", () => {
  if (!orbiting) return;
  const now = performance.now();
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0;
  lastT = now;
  if (dt === 0) return;
  orbitT += dt;
  const k = Math.min(1, orbitT / ORBIT_RAMP), ease = k * k * (3 - 2 * k);
  camState.heading += orbitSpeed * ease * dt * 180 / Math.PI;
  applyCam(lookFrom && k < 1 ? lookFrom.add(summit.sub(lookFrom).scaleTo(ease)) : summit);
});
function orbitStep() {
  lastT = 0; orbitT = 0;
  stateFromEye();
  // точка, куда камера смотрит сейчас (на расстоянии до вершины) — от неё взгляд плавно переходит на вершину
  lookFrom = looksAtSummit() ? null : planet.camera.eye.add(planet.camera.getForward().scaleTo(camState.dist));
}
function stopOrbit() {
  orbiting = false;
  document.getElementById("bOrbit").classList.remove("on");
  document.getElementById("bOrbit").textContent = "Облёт ⟳";
}

const chips = document.getElementById("chips");
MOUNTAINS.forEach((m, i) => {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = m.name;
  b.onclick = () => goTo(i);
  chips.appendChild(b);
});

document.getElementById("bMode").onclick = function () {
  flyMode = !flyMode;
  this.textContent = flyMode ? "Пролёт" : "Телепорт";
};
// Облёт начинается прямо с текущего положения и масштаба камеры — никаких перелётов.
// Камера вращается вокруг вертикальной оси, проходящей через вершину (конечную точку маршрута).
function startOrbit() {
  const btn = document.getElementById("bOrbit");
  btn.classList.add("on"); btn.textContent = "Стоп ■";
  planet.stopFlying();
  orbiting = true; orbitStep();
}
document.getElementById("bOrbit").onclick = function () {
  if (orbiting) { stopOrbit(); return; }
  if (!summit) return;
  startOrbit();
};
// Пользователь трогает глобус — облёт выключается, чтобы не мешать
document.getElementById("globus").addEventListener("pointerdown", () => { if (orbiting) stopOrbit(); });

// ---- Наклон и расстояние камеры относительно вершины ----
// Обе ручки работают от вершины (конечной точки маршрута), а не от центра экрана:
//  • наклон — камера поворачивается вверх-вниз вокруг вершины, расстояние до неё не меняется;
//  • расстояние — камера едет прямо к вершине или от неё, угол не меняется.
// Ориентация камеры при этом не перестраивается, поэтому картинка не дёргается.
const TILT_MAX = 85, TILT_POW = 1.8;        // у ползунка наклона больше хода в диапазоне 0–30°
const tiltFromSlider = t => TILT_MAX * Math.pow(t / 1000, TILT_POW);
const sliderFromTilt = e => 1000 * Math.pow(Math.max(0, e) / TILT_MAX, 1 / TILT_POW);
const Z_MIN = 1000, Z_MAX = 120000;          // м, логарифмическая шкала
const zoomFromSlider = t => Z_MIN * Math.pow(Z_MAX / Z_MIN, t / 1000);
const sliderFromZoom = d => 1000 * Math.log(d / Z_MIN) / Math.log(Z_MAX / Z_MIN);

function elevationDeg() {
  const v = planet.camera.eye.sub(summit);
  return Math.asin(Math.max(-1, Math.min(1, v.dot(U) / v.length()))) * 180 / Math.PI;
}
const distToTop = () => planet.camera.eye.sub(summit).length();
const fmtDist = d => d >= 10000 ? Math.round(d / 1000) + " км" : (d / 1000).toFixed(1).replace(".", ",") + " км";

function showCamVals() {
  document.getElementById("tiltVal").textContent = Math.round(elevationDeg()) + "°";
  document.getElementById("zoomVal").textContent = fmtDist(distToTop());
}
function syncCam() {
  if (!summit) return;
  document.getElementById("tilt").value = sliderFromTilt(elevationDeg());
  document.getElementById("zoom").value = sliderFromZoom(Math.min(Z_MAX, Math.max(Z_MIN, distToTop())));
  showCamVals();
}
// Наклон и расстояние меняют только своё число в состоянии камеры; курс сохраняется.
// Во время облёта состояние уже актуально; иначе берём его из текущего положения камеры.
function applyTilt(deg) { if (!orbiting) stateFromEye(); camState.elev = deg; applyCam(); }
function applyZoom(d) { if (!orbiting) stateFromEye(); camState.dist = d; applyCam(); }
const tiltEl = document.getElementById("tilt"), zoomEl = document.getElementById("zoom");
let dragging = false;
[tiltEl, zoomEl].forEach(el => {
  el.addEventListener("pointerdown", () => { dragging = true; planet.stopFlying(); });
  el.addEventListener("change", () => { dragging = false; });
});
window.addEventListener("pointerup", () => { dragging = false; });
tiltEl.addEventListener("input", () => {
  if (!summit) return;
  settings.tilt = tiltFromSlider(+tiltEl.value); applyTilt(settings.tilt); showCamVals(); saveSettings();
});
zoomEl.addEventListener("input", () => {
  if (!summit) return;
  settings.dist = zoomFromSlider(+zoomEl.value); applyZoom(settings.dist); showCamVals(); saveSettings();
});
// Скорость облёта: логарифмическая шкала, показываем, за сколько секунд камера делает полный круг
const S_MIN = 0.03, S_MAX = 0.8;             // рад/с: круг за ~3,5 мин … ~8 с
const speedFromSlider = t => S_MIN * Math.pow(S_MAX / S_MIN, t / 1000);
const sliderFromSpeed = v => 1000 * Math.log(v / S_MIN) / Math.log(S_MAX / S_MIN);
const speedEl = document.getElementById("speed");
function showSpeed() {
  const sec = Math.round(2 * Math.PI / orbitSpeed);
  document.getElementById("speedVal").textContent = sec >= 120
    ? "круг за " + Math.floor(sec / 60) + " мин " + (sec % 60 ? sec % 60 + " с" : "")
    : "круг за " + sec + " с";
}
speedEl.value = sliderFromSpeed(orbitSpeed); showSpeed();
speedEl.addEventListener("input", () => {
  orbitSpeed = settings.speed = speedFromSlider(+speedEl.value); showSpeed(); saveSettings();
});
// Сброс: угол 22°, круг за 20 с, расстояние снова подбирается под маршрут
document.getElementById("camReset").onclick = () => {
  Object.assign(settings, DEFAULTS); saveSettings();
  orbitSpeed = settings.speed; speedEl.value = sliderFromSpeed(orbitSpeed); showSpeed();
  const i = MOUNTAINS.indexOf(current); if (i >= 0) goTo(i);
  syncCam();
};

document.getElementById("bCam").onclick = function () {
  const p = document.getElementById("cam");
  p.hidden = !p.hidden;
  if (!p.hidden) { document.getElementById("sun").hidden = true; document.getElementById("bSun").classList.toggle("on", sunState.on); }
  this.classList.toggle("on", !p.hidden);
  if (!p.hidden) syncCam();
};
// если камеру сдвинули пальцем или облётом — ползунки подстраиваются под неё
planet.camera.events.on("viewchange", () => {
  if (!dragging && !document.getElementById("cam").hidden) syncCam();
});

// ---- Солнце ----
// Включённое «освещение по солнцу» ставит свет движка (контрол Sun) в настоящее положение солнца
// для выбранных даты и местного солнечного времени у выбранной горы: 12:00 — солнце в зените своего дня.
// Видно, какие склоны освещены утром и вечером. Выключено — свет «от камеры», как раньше.
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const sunEl = { on: document.getElementById("sunOn"), time: document.getElementById("sunTime"), date: document.getElementById("sunDate") };
const sunState = { on: false, minutes: 720, doy: 171 };
try { Object.assign(sunState, JSON.parse(localStorage.getItem("mountains-demo-sun-v1") || "{}")); } catch (e) {}
const saveSun = () => { try { localStorage.setItem("mountains-demo-sun-v1", JSON.stringify(sunState)); } catch (e) {} };
function sunDateUTC() {
  const year = new Date().getUTCFullYear();
  const lon = current ? current.lon : 0;
  return new Date(Date.UTC(year, 0, 1) + sunState.doy * 864e5 + (sunState.minutes - lon * 4) * 6e4);   // 4 мин на градус долготы
}
function applySun() {
  const sun = planet.sun;
  const mins = Math.floor(sunState.minutes);
  const hh = Math.floor(mins / 60), mm = mins % 60;
  document.getElementById("sunTimeVal").textContent = hh + ":" + String(mm).padStart(2, "0");
  const d = new Date(Date.UTC(2001, 0, 1) + sunState.doy * 864e5);
  document.getElementById("sunDateVal").textContent = d.getUTCDate() + " " + MONTHS[d.getUTCMonth()];
  sunEl.on.checked = sunState.on; sunEl.time.value = sunState.minutes; sunEl.date.value = sunState.doy;
  document.getElementById("bSun").classList.toggle("on", sunState.on || !document.getElementById("sun").hidden);
  if (!sun) return;
  // в 0.28.7: остановленный контрол Sun ставит солнце по дате часов движка; запущенный — светит «от камеры»
  const clock = planet.renderer.handler.defaultClock;
  if (sunState.on) { sun.stop(); clock.multiplier = 0; clock.setDate(sunDateUTC()); }
  else { sun.start(); clock.multiplier = 1; clock.setDate(new Date()); }
}
sunEl.on.onchange = () => { sunState.on = sunEl.on.checked; saveSun(); applySun(); };
sunEl.time.oninput = () => { sunState.minutes = +sunEl.time.value; sunState.on = true; saveSun(); applySun(); };
sunEl.date.oninput = () => { sunState.doy = +sunEl.date.value; sunState.on = true; saveSun(); applySun(); };
document.getElementById("sunNow").onclick = () => {
  const now = new Date(), lon = current ? current.lon : 0;
  const solar = (now.getUTCHours() * 60 + now.getUTCMinutes() + lon * 4 + 1440) % 1440;
  sunState.minutes = Math.round(solar / 5) * 5;
  sunState.doy = Math.floor((now - Date.UTC(now.getUTCFullYear(), 0, 1)) / 864e5);
  sunState.on = true; saveSun(); applySun();
};
// Проигрывание: сутки за 24 секунды, через цикл отрисовки
let sunPlaying = false, sunLastT = 0;
document.getElementById("sunPlay").onclick = function () {
  sunPlaying = !sunPlaying; sunLastT = 0;
  this.classList.toggle("on", sunPlaying);
  this.textContent = sunPlaying ? "■ Стоп" : "▶ Сутки за 24 с";
  if (sunPlaying) { sunState.on = true; applySun(); }
};
planet.renderer.events.on("postdraw", () => {
  if (!sunPlaying) return;
  const now = performance.now();
  if (sunLastT) {
    sunState.minutes = (sunState.minutes + (now - sunLastT) / 1000 * 60) % 1440;
    applySun();
  }
  sunLastT = now;
});
document.getElementById("bSun").onclick = function () {
  const p = document.getElementById("sun");
  p.hidden = !p.hidden;
  if (!p.hidden) document.getElementById("cam").hidden = true, document.getElementById("bCam").classList.remove("on");
  applySun();
};
applySun();

// ---- Диагностика: включаем/выключаем части сцены, чтобы найти источник мерцания ----
document.getElementById("bDiag").onclick = () => {
  const d = document.getElementById("diag"); d.hidden = !d.hidden;
};
// Переключение снимков: показываем слои выбранного источника, прячем другие
function applyImagery() {
  const framesOn = document.getElementById("dFrames").checked;
  for (const [kind, set] of Object.entries(IMAGERY)) {
    const on = kind === mapSettings.imagery;
    set.mountains.forEach(l => l.setVisibility(on && framesOn));
    if (!on) { set.base.setVisibility(false); set.full.setVisibility(false); }
  }
  planet.setBaseLayer(framesOn ? IMAGERY[mapSettings.imagery].base : IMAGERY[mapSettings.imagery].full);
  document.querySelectorAll("#segImg button").forEach(b => b.classList.toggle("on", b.dataset.v === mapSettings.imagery));
}
// Переключение рельефа: после смены маршруты заново укладываются по новому рельефу
let terrainOff = false;
function applyTerrain() {
  planet.setTerrain(terrainOff ? new EmptyTerrain() : TERRAINS[mapSettings.terrain]);
  hCache.clear();
  drapeGen++;
  MOUNTAINS.forEach(m => m.routes.forEach(rt => { rt.draped = false; }));
  if (current) Promise.all(current.routes.map(rt => drapeRoute(rt, current.name))).then(scheduleBackgroundDrape);
  document.querySelectorAll("#segTer button").forEach(b => b.classList.toggle("on", b.dataset.v === mapSettings.terrain));
}
document.querySelectorAll("#segImg button").forEach(b => b.onclick = () => { mapSettings.imagery = b.dataset.v; saveMap(); applyImagery(); });
document.querySelectorAll("#segTer button").forEach(b => b.onclick = () => {
  if (mapSettings.terrain === b.dataset.v) return;
  mapSettings.terrain = b.dataset.v; saveMap(); applyTerrain();
});
document.querySelectorAll("#segImg button").forEach(b => b.classList.toggle("on", b.dataset.v === mapSettings.imagery));
document.querySelectorAll("#segTer button").forEach(b => b.classList.toggle("on", b.dataset.v === mapSettings.terrain));
document.getElementById("dFrames").onchange = () => applyImagery();
document.getElementById("dTerrain").onchange = (e) => { terrainOff = !e.target.checked; applyTerrain(); };
document.getElementById("dAtmos").onchange = (e) => {
  planet.atmosphereEnabled = e.target.checked;
};
// Счётчик кадров в секунду
let frames = 0, fpsT = performance.now();
planet.renderer.events.on("postdraw", () => {
  frames++;
  const now = performance.now();
  if (now - fpsT > 1000) {
    document.getElementById("fps").textContent = "FPS: " + Math.round(frames * 1000 / (now - fpsT));
    document.getElementById("nodes").textContent = "Узлов: " + planet._createdNodesCount + " (очистка после " + planet._maxNodes + ")";
    frames = 0; fpsT = now;
  }
});

// Старт на первой горе: ставим камеру сразу и ещё раз, когда движок закончит инициализацию
goTo(0);
setTimeout(() => { if (current === MOUNTAINS[0] && !orbiting) applyCam(); }, 600);
</script>
</body>
</html>
